spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/tongrenlu?useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.username= deepseek
spring.datasource.password= ${DB_PASSWORD}
mybatis.mapper-locations=classpath:info/tongrenlu/mapper/*.xml
mybatis.type-aliases-package=info.tongrenlu.domain
mybatis.configuration.default-executor-type=REUSE
mybatis.configuration.lazy-loading-enabled=true
mybatis.configuration.aggressive-lazy-loading=false

# Original update job cron schedule (default: 3 AM daily)
app.original-update.cron=0 0 3 * * ?

# ============================================================
# HTTP Basic 认证：保护本模块全部接口与静态管理页
# 凭据来源：环境变量注入（生产必须注入，否则启动直接失败）
#   TOOL_AUTH_ENABLED=true|false   本地调试可临时置 false 关闭认证
#   TOOL_AUTH_USERNAME=xxx
#   TOOL_AUTH_PASSWORD=xxx          启用认证时若为空或仍为默认值 tongrenlu，启动即失败
# ============================================================
app.basic-auth.enabled=${TOOL_AUTH_ENABLED:true}
app.basic-auth.username=${TOOL_AUTH_USERNAME:admin}
app.basic-auth.password=${TOOL_AUTH_PASSWORD:tongrenlu}
app.basic-auth.realm-name=tongrenlu-tool


# 网易云接口基址：本机自建的 NeteaseCloudMusicApi（服务在 3000 端口）
# 服务端调用走回环地址；需要指向别处时用环境变量 CLOUD_MUSIC_API_BASE 覆盖
app.cloud-music-api.base=${CLOUD_MUSIC_API_BASE:http://127.0.0.1:3000}

# 云音乐接口 HTTP 超时（毫秒）：由代码读取系统属性，默认连接 10s、读取 60s
#   -Dtongrenlu.cloud-music.connect-timeout-ms=10000
#   -Dtongrenlu.cloud-music.read-timeout-ms=60000

# 歌单导入断点续传进度文件：默认相对运行目录 data/playlist_progress.json
#   Spring 配置项：app.playlist-import.progress-file=/var/lib/tongrenlu/playlist_progress.json
#   系统属性：-Dtongrenlu.playlist.progress-file=/var/lib/tongrenlu/playlist_progress.json
#   环境变量：TONGRLU_PLAYLIST_PROGRESS_FILE=/var/lib/tongrenlu/playlist_progress.json
# 进度内容为 JSON（含 playlistId 与 index），歌单不匹配时自动视为无进度、从头开始。
