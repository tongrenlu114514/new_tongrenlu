spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/tongrenlu?useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.username= deepseek
spring.datasource.password= ${DB_PASSWORD}
mybatis.mapper-locations=classpath:info/tongrenlu/mapper/*.xml
mybatis.type-aliases-package=info.tongrenlu.domain
mybatis.configuration.default-executor-type=REUSE
mybatis.configuration.lazy-loading-enabled=true
mybatis.configuration.aggressive-lazy-loading=false

# Original update job cron schedule (default: 3 AM daily)
app.original-update.cron=0 0 3 * * ?

# ============================================================
# HTTP Basic 认证：保护本模块全部接口与静态管理页
# 默认值仅供本地开发，生产环境请用环境变量注入凭据：
#   TOOL_AUTH_ENABLED=true|false   本地调试可临时置 false 关闭认证
#   TOOL_AUTH_USERNAME=xxx
#   TOOL_AUTH_PASSWORD=xxx          启用认证时若为空则启动失败
# ============================================================
app.basic-auth.enabled=${TOOL_AUTH_ENABLED:true}
app.basic-auth.username=${TOOL_AUTH_USERNAME:admin}
app.basic-auth.password=${TOOL_AUTH_PASSWORD:tongrenlu}
app.basic-auth.realm-name=tongrenlu-tool

