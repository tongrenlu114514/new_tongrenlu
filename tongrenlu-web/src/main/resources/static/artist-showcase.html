<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>艺术家 - 东方同人录</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link href="webjars/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="assets/css/geometric-theme.css?v=20261240" rel="stylesheet">
    <link href="assets/css/wiki.css?v=20261240" rel="stylesheet">
    <link href="assets/css/list-page.css?v=20261240" rel="stylesheet">
    <link href="components/shared/pagination.css?v=20261240" rel="stylesheet">
    <link href="components/artist-showcase/artist-showcase.css?v=20261240" rel="stylesheet">
</head>
<body class="geo-theme">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <!-- 导航栏 -->
    <nav class="geo-nav">
        <a href="index.html" class="geo-logo">TONGRENLU</a>
        <div class="geo-nav__links">
            <a href="index.html" class="geo-nav__link">首页</a>
            <a href="album.html" class="geo-nav__link">音乐库</a>
            <a href="artist-showcase.html" class="geo-nav__link active">艺术家</a>
            <a href="event.html" class="geo-nav__link">展会</a>
        </div>
        <div class="geo-nav__stats">
            <span class="geo-nav__number" id="navArtistCount">--</span>
            <span class="geo-nav__label">艺术家</span>
        </div>
    </nav>

    <main id="main" class="geo-wiki-page">
        <!-- 列表视图 -->
        <div id="artistListView">
            <div class="geo-wiki-header">
                <div class="geo-wiki-header__decor" aria-hidden="true">
                    <span class="geo-wiki-header__watermark">ARTISTS</span>
                </div>
                <div class="geo-wiki-header__inner">
                    <div class="geo-wiki-header__eyebrow">Touhou Artist Archive</div>
                    <h1 class="geo-wiki-title">同人<span class="accent">创作者</span></h1>
                    <p class="geo-wiki-subtitle">收录本站音乐库中的同人社团与创作者，词条内容来自 OKF 概念库</p>
                    <div class="geo-wiki-search">
                        <input type="text" class="geo-wiki-search__input" id="artistSearchInput" placeholder="搜索艺术家..." aria-label="搜索艺术家">
                        <i class="fas fa-search geo-wiki-search__icon" aria-hidden="true"></i>
                        <button class="geo-wiki-search__clear" id="artistSearchClear" aria-label="清除搜索">
                            <i class="fas fa-times"></i>
                        </button>
                        <div class="geo-suggestions" id="artistSearchHistory"></div>
                    </div>
                </div>
            </div>

            <div class="geo-wiki-filter" data-rv>
                <div class="geo-wiki-filter__inner">
                    <div class="geo-sort">
                        <span class="geo-sort__label">排序</span>
                        <button type="button" class="sort-btn active" data-sort="album_count" aria-pressed="true">专辑数量</button>
                        <button type="button" class="sort-btn" data-sort="name" aria-pressed="false">名称</button>
                        <select class="geo-filter-select" id="artistSortSelect" aria-label="排序方式">
                            <option value="album_count">专辑数量</option>
                            <option value="name">名称</option>
                        </select>
                    </div>
                </div>
            </div>

            <h2 class="sr-only">创作者列表</h2>
            <div class="geo-wiki-grid" id="artistGrid"></div>

            <div class="pgn-mount" id="artistPagination" hidden></div>

            <div id="artistLoading" style="display: none;">
                <i class="fas fa-spinner fa-spin"></i>
                <span>加载艺术家...</span>
            </div>

            <div id="artistEmpty" role="status" style="display: none;">
                <i class="fas fa-user-slash geo-wiki-empty__icon"></i>
                <p>未找到匹配的艺术家</p>
            </div>
        </div>

        <!-- 详情视图 -->
        <div class="geo-wiki-detail" id="artistDetailView" style="display: none;">
            <button class="geo-wiki-back" id="artistBackBtn">
                <i class="fas fa-arrow-left"></i> 返回列表
            </button>

            <div id="artistDetailLoading" class="geo-wiki-detail-loading">
                <i class="fas fa-spinner fa-spin"></i>
                <span>加载艺术家...</span>
            </div>

            <div id="artistDetailError" class="geo-wiki-detail-error" style="display: none;">
                <i class="fas fa-user-slash" style="font-size: 2rem; margin-bottom: 1rem; display: block; opacity: 0.5;"></i>
                未找到该艺术家
            </div>

            <div id="artistDetailContent" style="display: none;">
                <div class="geo-wiki-hero">
                    <div class="geo-wiki-hero__avatar" id="artistHeroAvatar"></div>
                    <div class="geo-wiki-hero__main">
                        <h1 class="geo-wiki-name" id="artistHeroName">--</h1>
                        <div class="geo-wiki-stats" id="artistHeroStats"></div>
                        <div class="geo-wiki-links" id="artistHeroLinks"></div>
                    </div>
                </div>

                <div class="geo-wiki-section" data-rv>
                    <h2 class="geo-wiki-section__title"><span class="geo-wiki-section__index">01</span>词条正文</h2>
                    <div class="geo-wiki-desc" id="artistDesc"></div>
                </div>

                <div class="geo-wiki-section" id="artistTagsSection" style="display: none;" data-rv>
                    <h2 class="geo-wiki-section__title"><span class="geo-wiki-section__index">02</span>互联标签</h2>
                    <div class="geo-wiki-tags" id="artistTagChips"></div>
                </div>

                <div class="geo-wiki-section" data-rv>
                    <h2 class="geo-wiki-section__title"><span class="geo-wiki-section__index">03</span>相关专辑</h2>
                    <div class="geo-wiki-albums" id="artistAlbums"></div>
                    <div class="geo-wiki-albums-pagination pgn-mount" id="artistAlbumsPagination" hidden></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="geo-footer">
        <div class="geo-footer__logo">TONGRENLU</div>
        <p class="geo-footer__text">&copy; 2025 东方同人录. 本站所有内容版权归原作者所有.</p>
        <p class="geo-footer__text">本网站仅为学习交流使用，不涉及任何商业用途</p>
        <p class="geo-footer__meta">v3.0 GEOMETRIC · ARTIST MODULE</p>
    </footer>


    <!-- JavaScript -->
    <script src="webjars/jquery/jquery.min.js"></script>
    <script src="components/shared/image-loader.js"></script>
    <script src="components/shared/folia-player.js"></script>
    <script src="components/shared/wiki-utils.js"></script>
    <script src="components/shared/search-history.js?v=20261240"></script>
    <script src="components/shared/list-state.js?v=20261240"></script>
    <script src="components/shared/pagination.js?v=20261240"></script>
    <script src="components/artist-showcase/artist-showcase.js?v=20261240"></script>
</body>
</html>
