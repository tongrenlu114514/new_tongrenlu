<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>展会词条 - 东方同人录</title>
    <!--
      旧展会页面已由统一百科词条页（wiki.html?type=event）取代。
      本页仅保留为兼容壳：老书签 / 外部链接会自动跳转到展会词条列表；
      ?id= 则直接进入对应展会词条详情。
    -->
    <script>
        (function() {
            var id = new URLSearchParams(window.location.search).get('id');
            var target = 'wiki.html?type=event' + (id ? '&id=' + encodeURIComponent(id) : '');
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>展会页面已迁移至 <a href="wiki.html?type=event">展会词条</a>，正在跳转…</p>
    <noscript><p>请手动打开 <a href="wiki.html?type=event">展会词条</a>。</p></noscript>
</body>
</html>
