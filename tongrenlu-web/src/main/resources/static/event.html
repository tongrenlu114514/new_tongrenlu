<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>展会 - 东方同人录</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="assets/css/geometric-theme.css" rel="stylesheet">

    <style>
        /* ================================================================
           展会 — Award Tier Design System（与 artist-wiki / album 同一语言）
           令牌(:root) → 基础 → 头部 → 筛选工具条 → 网格卡片 → 模态框 → 动效 → 响应式
           ================================================================ */
        :root {
            /* 色彩令牌（:root 全局作用域：模态框等页面外元素也需要） */
            --wiki-ink: #1a1a2e;
            --wiki-ink-soft: #23233d;
            --wiki-accent: #e94560;
            --wiki-blue: #0f3460;
            --wiki-paper: #ffffff;
            --wiki-paper-2: #f6f7fb;
            --wiki-line: #e5e7ef;
            --wiki-muted: #8a90a6;
            /* 空白令牌 */
            --ws-xs: 0.5rem;
            --ws-s: 1rem;
            --ws-m: 1.5rem;
            --ws-l: 2.5rem;
            --ws-xl: 4rem;
            --ws-2xl: clamp(4rem, 9vw, 7.5rem);
            /* 动效令牌 */
            --wiki-ease: cubic-bezier(0.22, 1, 0.36, 1);
            --wiki-ease-snap: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .geo-event-page {
            padding-top: 80px;
            min-height: 100vh;
            background:
                linear-gradient(180deg, var(--wiki-paper-2) 0%, var(--wiki-paper) 40%);
        }

        /* 选区 / 滚动条 / 焦点 */
        .geo-event-page ::selection {
            background: var(--wiki-accent);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--wiki-paper-2);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--wiki-ink);
            border: 2px solid var(--wiki-paper-2);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--wiki-accent);
        }

        .geo-event-page a:focus-visible,
        .geo-event-page button:focus-visible,
        .geo-event-page input:focus-visible,
        .geo-event-page .event-card:focus-visible,
        .geo-event-page .event-filter-tab:focus-visible,
        .geo-event-page .event-sort-btn:focus-visible {
            outline: 2px solid var(--wiki-accent);
            outline-offset: 3px;
        }

        /* ===== 阅读进度条 ===== */
        .wiki-progress {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            z-index: 1200;
            background: transparent;
            pointer-events: none;
        }

        .wiki-progress__bar {
            display: block;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--wiki-blue), var(--wiki-accent));
            transition: width 0.1s linear;
        }

        /* ================= 动效原语 ================= */
        @keyframes wiki-rise {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes wiki-card-in {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes wiki-line-grow {
            from { transform: scaleX(0); }
            to   { transform: scaleX(1); }
        }
        @keyframes wiki-glow-drift {
            0%   { transform: translate(-10%, -6%) rotate(-4deg); }
            50%  { transform: translate(6%, 4%) rotate(3deg); }
            100% { transform: translate(-10%, -6%) rotate(-4deg); }
        }
        @keyframes modal-fade {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes modal-in {
            from { opacity: 0; transform: translateY(26px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        [data-rv].rv-armed {
            opacity: 0;
            transform: translateY(26px);
            transition:
                opacity 0.8s var(--wiki-ease) var(--rv-delay, 0s),
                transform 0.8s var(--wiki-ease) var(--rv-delay, 0s);
        }
        [data-rv].rv-armed.is-visible {
            opacity: 1;
            transform: none;
        }

        /* ===== 头部 ===== */
        .geo-event-header {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(ellipse 60% 90% at 85% 10%, rgba(233, 69, 96, 0.22), transparent 60%),
                radial-gradient(ellipse 50% 80% at 10% 90%, rgba(15, 52, 96, 0.5), transparent 65%),
                linear-gradient(160deg, var(--wiki-ink) 0%, var(--wiki-ink-soft) 55%, #2a2a4a 100%);
            padding: var(--ws-2xl) 2rem var(--ws-xl);
            text-align: center;
        }

        .geo-event-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
            background-size: 56px 56px;
            -webkit-mask-image: radial-gradient(ellipse 90% 100% at 50% 40%, black 30%, transparent 100%);
            mask-image: radial-gradient(ellipse 90% 100% at 50% 40%, black 30%, transparent 100%);
        }

        .geo-event-header::after {
            content: '';
            position: absolute;
            inset: -20%;
            background:
                radial-gradient(circle 300px at 80% 30%, rgba(233, 69, 96, 0.14), transparent 70%);
            animation: wiki-glow-drift 14s ease-in-out infinite;
            pointer-events: none;
        }

        .geo-event-header__watermark {
            position: absolute;
            top: 46%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif;
            font-size: clamp(10rem, 34vw, 30rem);
            letter-spacing: 0.08em;
            line-height: 1;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.07);
            user-select: none;
            pointer-events: none;
            white-space: nowrap;
        }

        .geo-event-header__inner {
            position: relative;
            z-index: 2;
        }

        .geo-event-header__eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: var(--ws-m);
            animation: wiki-rise 0.9s var(--wiki-ease) 0.05s both;
        }

        .geo-event-header__eyebrow::before,
        .geo-event-header__eyebrow::after {
            content: '';
            width: 2.5rem;
            height: 1px;
            background: rgba(255, 255, 255, 0.25);
        }

        .geo-event-title {
            font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif;
            font-size: clamp(3.2rem, 9vw, 6.5rem);
            line-height: 0.95;
            letter-spacing: 0.04em;
            color: #fff;
            margin: 0 0 var(--ws-m);
            animation: wiki-rise 0.9s var(--wiki-ease) 0.15s both;
        }

        .geo-event-title .accent {
            color: var(--wiki-accent);
        }

        .geo-event-subtitle {
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 300;
            font-size: clamp(0.9rem, 1.4vw, 1.05rem);
            letter-spacing: 0.14em;
            color: rgba(255, 255, 255, 0.65);
            margin: 0 auto var(--ws-xl);
            max-width: 34em;
            animation: wiki-rise 0.9s var(--wiki-ease) 0.25s both;
        }

        .geo-event-search {
            max-width: 560px;
            margin: 0 auto;
            position: relative;
            animation: wiki-rise 0.9s var(--wiki-ease) 0.35s both;
        }

        .geo-event-search__input {
            width: 100%;
            padding: 1.1rem 3.2rem 1.1rem 1.4rem;
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.02em;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.94);
            color: var(--wiki-ink);
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            transition: background 0.4s var(--wiki-ease), box-shadow 0.4s var(--wiki-ease);
        }

        .geo-event-search__input:focus {
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 2px var(--wiki-accent) inset;
        }

        .geo-event-search__input::placeholder {
            color: var(--wiki-muted);
        }

        .geo-event-search__icon {
            position: absolute;
            right: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--wiki-muted);
            transition: color 0.3s ease, transform 0.3s var(--wiki-ease-snap);
        }

        .geo-event-search:focus-within .geo-event-search__icon {
            color: var(--wiki-accent);
            transform: translateY(-50%) scale(1.15);
        }

        .geo-event-search__clear {
            position: absolute;
            right: 2.7rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--wiki-muted);
            cursor: pointer;
            display: none;
            transition: color 0.25s ease, transform 0.25s var(--wiki-ease-snap);
        }

        .geo-event-search__clear:hover {
            color: var(--wiki-accent);
            transform: translateY(-50%) rotate(90deg);
        }

        .geo-event-search__clear.visible {
            display: block;
        }

        /* ===== 筛选工具条 ===== */
        .geo-event-filter {
            background: var(--wiki-paper);
            border-bottom: 1.5px solid var(--wiki-line);
            padding: var(--ws-m) 2rem;
            position: relative;
            z-index: 50;
        }

        .geo-event-filter__inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--ws-s);
        }

        .geo-event-tabs,
        .event-filter-tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .geo-event-tab,
        .event-filter-tab {
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.5rem 1.1rem;
            border: 1.5px solid var(--wiki-line);
            background: var(--wiki-paper-2);
            color: var(--wiki-muted);
            cursor: pointer;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition:
                color 0.3s var(--wiki-ease),
                border-color 0.3s var(--wiki-ease),
                background 0.3s var(--wiki-ease),
                transform 0.3s var(--wiki-ease),
                box-shadow 0.3s var(--wiki-ease);
        }

        .geo-event-tab:hover,
        .event-filter-tab:hover {
            border-color: var(--wiki-accent);
            color: var(--wiki-accent);
            transform: translateY(-2px);
        }

        .geo-event-tab.active,
        .event-filter-tab.active {
            background: var(--wiki-accent);
            border-color: var(--wiki-accent);
            color: white;
            transform: none;
            box-shadow: 3px 3px 0 rgba(26, 26, 46, 0.85);
        }

        .geo-event-sort {
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .geo-event-sort__label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--wiki-muted);
        }

        .geo-event-sort__btn,
        .event-sort-btn {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border: 1.5px solid var(--wiki-line);
            background: var(--wiki-paper-2);
            color: var(--wiki-muted);
            cursor: pointer;
            letter-spacing: 0.06em;
            transition:
                color 0.3s var(--wiki-ease),
                border-color 0.3s var(--wiki-ease),
                background 0.3s var(--wiki-ease),
                transform 0.3s var(--wiki-ease);
        }

        .geo-event-sort__btn:hover,
        .event-sort-btn:hover {
            border-color: var(--wiki-blue);
            color: var(--wiki-blue);
            transform: translateY(-2px);
        }

        .geo-event-sort__btn.active,
        .event-sort-btn.active {
            background: var(--wiki-blue);
            border-color: var(--wiki-blue);
            color: white;
            transform: none;
        }

        /* ===== 展会网格 ===== */
        .geo-event-grid,
        #eventGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: clamp(1rem, 2.2vw, 1.75rem);
            padding: var(--ws-l) 2rem var(--ws-xl);
            max-width: 1500px;
            margin: 0 auto;
        }

        /* ===== 展会卡片 ===== */
        .geo-event-card,
        .event-card {
            background: var(--wiki-paper);
            border: 1.5px solid var(--wiki-line);
            overflow: hidden;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            transition:
                transform 0.45s var(--wiki-ease),
                border-color 0.45s var(--wiki-ease),
                box-shadow 0.45s var(--wiki-ease);
            animation: wiki-card-in 0.7s var(--wiki-ease) both;
            animation-delay: min(calc(var(--i, 0) * 45ms), 0.6s);
        }

        .geo-event-card::before,
        .event-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 26px;
            height: 26px;
            background: var(--wiki-accent);
            clip-path: polygon(0 0, 100% 0, 0 100%);
            opacity: 0;
            transform: scale(0.4);
            transition: opacity 0.35s ease, transform 0.45s var(--wiki-ease-snap);
            z-index: 5;
        }

        .geo-event-card:hover,
        .event-card:hover {
            transform: translateY(-6px);
            border-color: var(--wiki-ink);
            box-shadow: 10px 10px 0 var(--wiki-accent);
        }

        .geo-event-card:hover::before,
        .event-card:hover::before {
            opacity: 1;
            transform: scale(1);
        }

        /* 卡片头：墨色渐变带 */
        .geo-event-card__header,
        .event-card__header {
            padding: 1.1rem 1.4rem;
            background:
                radial-gradient(ellipse 80% 130% at 90% 0%, rgba(233, 69, 96, 0.22), transparent 60%),
                linear-gradient(160deg, var(--wiki-ink) 0%, var(--wiki-ink-soft) 100%);
            color: white;
            display: flex;
            align-items: center;
            gap: var(--ws-s);
        }

        .event-card__icon {
            width: 36px;
            height: 36px;
            background: var(--wiki-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            flex-shrink: 0;
            transition: transform 0.4s var(--wiki-ease-snap), background 0.3s ease;
        }

        .event-card:hover .event-card__icon {
            transform: rotate(-12deg) scale(1.1);
            background: var(--wiki-blue);
        }

        .event-card__series {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.68rem;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 0.18em;
        }

        .geo-event-card__body,
        .event-card__body {
            padding: 1.15rem 1.4rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .geo-event-card__name,
        .event-card__name {
            font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 0.05em;
            line-height: 1;
            color: var(--wiki-ink);
            margin-bottom: 0.4rem;
            transition: color 0.3s ease;
            word-break: break-word;
        }

        .event-card:hover .event-card__name {
            color: var(--wiki-accent);
        }

        .event-card__edition {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            font-size: 0.78rem;
            color: var(--wiki-muted);
            margin-bottom: 0.55rem;
            min-height: 1.2em;
        }

        .geo-event-card__count,
        .event-card__stats {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-size: 0.85rem;
            color: #3a3d52;
        }

        .geo-event-card__count i,
        .event-card__stat i {
            color: var(--wiki-accent);
        }

        .event-card__footer {
            padding: 0.8rem 1.4rem;
            border-top: 1.5px solid var(--wiki-line);
            background: var(--wiki-paper-2);
        }

        .event-card__view {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--wiki-accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .event-card__view i {
            transition: transform 0.35s var(--wiki-ease);
        }

        .event-card:hover .event-card__view i {
            transform: translateX(4px);
        }

        /* ===== 加载 / 空状态 ===== */
        #eventLoading,
        .geo-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--ws-xl);
            gap: var(--ws-s);
        }

        .geo-loading__spinner,
        #eventLoading .fa-spinner {
            font-size: 2rem;
            color: var(--wiki-accent);
        }

        .geo-loading__text,
        #eventLoading p {
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            color: var(--wiki-muted);
        }

        .geo-event-empty {
            text-align: center;
            padding: var(--ws-2xl) var(--ws-m);
            color: var(--wiki-muted);
        }

        .geo-event-empty__icon {
            font-size: 3rem;
            margin-bottom: var(--ws-s);
            opacity: 0.4;
        }

        .geo-event-empty__text {
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.1em;
        }

        /* ===== 模态框 ===== */
        .geo-event-modal,
        #eventModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 46, 0.78);
            -webkit-backdrop-filter: blur(8px) saturate(0.8);
            backdrop-filter: blur(8px) saturate(0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .geo-event-modal.active,
        #eventModal.active {
            display: flex;
            animation: modal-fade 0.35s var(--wiki-ease) both;
        }

        .geo-event-modal__content {
            background: var(--wiki-paper);
            max-width: 900px;
            width: 100%;
            max-height: 88vh;
            overflow: hidden;
            border: 1.5px solid var(--wiki-line);
            box-shadow: 14px 14px 0 var(--wiki-ink);
            display: flex;
            flex-direction: column;
        }

        .geo-event-modal.active .geo-event-modal__content {
            animation: modal-in 0.55s var(--wiki-ease-snap) both;
        }

        .geo-event-modal__header {
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.4rem clamp(1.5rem, 3vw, 2rem);
            background:
                radial-gradient(ellipse 70% 130% at 90% 0%, rgba(233, 69, 96, 0.25), transparent 60%),
                linear-gradient(160deg, var(--wiki-ink) 0%, var(--wiki-ink-soft) 60%, #2a2a4a 100%);
            color: white;
        }

        .geo-event-modal__header::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--wiki-accent), var(--wiki-blue));
            transform-origin: left;
            animation: wiki-line-grow 0.9s var(--wiki-ease) 0.25s both;
        }

        .geo-event-modal__title,
        #eventModalTitle {
            font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif;
            font-size: clamp(1.5rem, 3vw, 2rem);
            letter-spacing: 0.06em;
        }

        .geo-event-modal__close,
        #eventModalClose {
            width: 38px;
            height: 38px;
            background: var(--wiki-accent);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition:
                background 0.3s ease,
                transform 0.35s var(--wiki-ease-snap);
        }

        .geo-event-modal__close:hover,
        #eventModalClose:hover {
            background: var(--wiki-blue);
            transform: rotate(90deg) scale(1.06);
        }

        .geo-event-modal__body,
        #eventModalBody {
            padding: clamp(1.25rem, 2.5vw, 2rem);
            overflow-y: auto;
            max-height: calc(88vh - 160px);
        }

        .event-modal__loading,
        .event-modal__empty {
            text-align: center;
            padding: var(--ws-xl);
            color: var(--wiki-muted);
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            letter-spacing: 0.1em;
        }

        .event-modal__loading i,
        .event-modal__empty i {
            font-size: 2rem;
            color: var(--wiki-accent);
            margin-bottom: var(--ws-s);
            display: block;
        }

        /* 专辑列表 */
        .geo-event-modal__albums,
        .event-album-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: clamp(0.8rem, 1.6vw, 1.1rem);
        }

        .geo-event-modal__album,
        .event-album-item {
            background: var(--wiki-paper-2);
            border: 1.5px solid var(--wiki-line);
            overflow: hidden;
            cursor: pointer;
            transition:
                border-color 0.35s var(--wiki-ease),
                transform 0.35s var(--wiki-ease),
                box-shadow 0.35s var(--wiki-ease);
        }

        .geo-event-modal__album:hover,
        .event-album-item:hover {
            border-color: var(--wiki-accent);
            transform: translateY(-4px);
            box-shadow: 5px 5px 0 var(--wiki-accent);
        }

        .geo-event-modal__album-cover,
        .event-album-item__cover {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, var(--wiki-paper), #eceef5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--wiki-muted);
            overflow: hidden;
        }

        .event-album-item__cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s var(--wiki-ease);
        }

        .event-album-item:hover .event-album-item__cover img {
            transform: scale(1.09);
        }

        .geo-event-modal__album-title,
        .event-album-item__title {
            padding: 0.7rem 0.75rem;
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-size: 0.8rem;
            color: var(--wiki-ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-top: 1.5px solid var(--wiki-line);
        }

        /* 分页 */
        .geo-event-modal__pagination,
        #eventModalPagination {
            display: flex;
            justify-content: center;
            padding: var(--ws-s);
            border-top: 1.5px solid var(--wiki-line);
        }

        .event-pagination,
        .event-main-pagination {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.45rem;
        }

        .event-pagination__info {
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            color: var(--wiki-muted);
            margin-right: 1rem;
        }

        .event-pagination__btn {
            font-family: 'Space Grotesk', sans-serif;
            min-width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--wiki-line);
            background: var(--wiki-paper);
            color: var(--wiki-ink);
            cursor: pointer;
            padding: 0 0.8rem;
            font-size: 0.85rem;
            transition:
                border-color 0.3s var(--wiki-ease),
                color 0.3s var(--wiki-ease),
                background 0.3s var(--wiki-ease),
                transform 0.15s ease;
        }

        .event-pagination__btn:hover:not(:disabled):not(.active) {
            border-color: var(--wiki-accent);
            color: var(--wiki-accent);
            transform: translateY(-2px);
        }

        .event-pagination__btn:active:not(:disabled) {
            transform: translateY(0) scale(0.95);
        }

        .event-pagination__btn.active {
            background: var(--wiki-accent);
            border-color: var(--wiki-accent);
            color: white;
        }

        .event-pagination__btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .event-pagination__ellipsis {
            padding: 0 0.4rem;
            color: var(--wiki-muted);
        }

        #eventPaginationContainer {
            display: flex;
            justify-content: center;
            padding: 0 2rem var(--ws-xl);
        }

        /* ================= 响应式 ================= */
        @media (max-width: 900px) {
            .geo-event-header {
                padding: var(--ws-xl) 1.5rem var(--ws-l);
            }
        }

        @media (max-width: 600px) {
            .geo-event-page {
                padding-top: 72px;
            }
            .geo-event-header {
                padding: var(--ws-l) 1.25rem 2.5rem;
            }
            .geo-event-grid {
                gap: 0.9rem;
                padding: var(--ws-m) 1.25rem var(--ws-l);
            }
            .geo-event-filter {
                padding: var(--ws-s) 1.25rem;
            }
            .geo-event-filter__inner {
                flex-direction: column;
                align-items: flex-start;
            }
            #eventPaginationContainer {
                padding: 0 1.25rem var(--ws-l);
            }
            .geo-event-modal {
                padding: 1rem;
            }
            .geo-event-modal__content {
                box-shadow: 8px 8px 0 var(--wiki-ink);
            }
        }

        /* ================= 无障碍：减少动效 ================= */
        @media (prefers-reduced-motion: reduce) {
            .geo-event-page *,
            .geo-event-page *::before,
            .geo-event-page *::after,
            .geo-event-modal *,
            .geo-event-modal *::before,
            .geo-event-modal *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            [data-rv].rv-armed {
                opacity: 1;
                transform: none;
            }
            .wiki-progress {
                display: none;
            }
        }
    </style>
</head>
<body class="geo-theme">
    <!-- 阅读进度条 -->
    <div class="wiki-progress" aria-hidden="true">
        <span class="wiki-progress__bar" id="wikiProgressBar"></span>
    </div>

    <!-- 导航栏 -->
    <nav class="geo-nav">
        <a href="index.html" class="geo-logo">TONGRENLU</a>
        <div class="geo-nav__links">
            <a href="index.html" class="geo-nav__link">首页</a>
            <a href="album.html" class="geo-nav__link">音乐库</a>
            <a href="artist-wiki.html" class="geo-nav__link">艺术家</a>
            <a href="event.html" class="geo-nav__link active">展会</a>
        </div>
        <div class="geo-nav__stats">
            <span class="geo-nav__number" id="eventCount">--</span>
            <span class="geo-nav__label">展会</span>
        </div>
    </nav>

    <!-- 展会页面 -->
    <div class="geo-event-page">
        <!-- 搜索头部 -->
        <div class="geo-event-header">
            <span class="geo-event-header__watermark" aria-hidden="true">EVENT</span>
            <div class="geo-event-header__inner">
                <div class="geo-event-header__eyebrow">Doujin Convention Index</div>
                <h1 class="geo-event-title">展会<span class="accent">列表</span></h1>
                <p class="geo-event-subtitle">东方同人展会收录，包括COMIC MARKET、例大祭、红楼梦等</p>
                <div class="geo-event-search">
                    <input type="text" class="geo-event-search__input" id="eventSearchInput" placeholder="搜索展会名称...">
                    <i class="fas fa-search geo-event-search__icon"></i>
                    <button class="geo-event-search__clear" id="eventSearchClear" aria-label="清除搜索">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 筛选区域 -->
        <div class="geo-event-filter" data-rv>
            <div class="geo-event-filter__inner">
                <div class="geo-event-tabs">
                    <button class="event-filter-tab active" data-filter="all">全部</button>
                    <button class="event-filter-tab" data-filter="comiket">Comic Market</button>
                    <button class="event-filter-tab" data-filter="reitaisai">例大祭</button>
                    <button class="event-filter-tab" data-filter="kouroumu">东方红楼梦</button>
                    <button class="event-filter-tab" data-filter="m3">M3</button>
                    <button class="event-filter-tab" data-filter="other">其他</button>
                </div>
                <div class="geo-event-sort">
                    <span class="geo-event-sort__label">排序</span>
                    <button class="event-sort-btn active" data-sort="album_count">专辑数量</button>
                    <button class="event-sort-btn" data-sort="name">名称</button>
                </div>
            </div>
        </div>

        <!-- 展会网格 -->
        <div class="geo-event-grid" id="eventGrid">
        </div>

        <!-- 加载状态 -->
        <div id="eventLoading" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i>
            <p>加载展会...</p>
        </div>

        <!-- 空状态 -->
        <div class="geo-event-empty" id="eventEmpty" style="display: none;">
            <i class="fas fa-calendar-times geo-event-empty__icon"></i>
            <p class="geo-event-empty__text">未找到匹配的展会</p>
        </div>

        <!-- 分页 -->
        <div id="eventPaginationContainer">
        </div>
    </div>

    <!-- 展会详情模态框 -->
    <div class="geo-event-modal" id="eventModal">
        <div class="geo-event-modal__content">
            <div class="geo-event-modal__header">
                <h2 class="geo-event-modal__title" id="eventModalTitle">展会专辑</h2>
                <button class="geo-event-modal__close" id="eventModalClose" aria-label="关闭">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="geo-event-modal__body" id="eventModalBody">
                <!-- 专辑动态加载 -->
            </div>
            <div class="geo-event-modal__pagination" id="eventModalPagination">
                <!-- 分页按钮 -->
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="geo-footer">
        <div class="geo-footer__logo">TONGRENLU</div>
        <p class="geo-footer__text">&copy; 2025 东方同人录. 本站所有内容版权归原作者所有.</p>
        <p class="geo-footer__text">本网站仅为学习交流使用，不涉及任何商业用途</p>
    </footer>

    <!-- 版本号 -->
    <div id="version-info" style="position: fixed; bottom: 10px; right: 10px; background: var(--geo-primary); color: white; padding: 5px 10px; font-family: 'Space Grotesk', sans-serif; font-size: 11px; z-index: 1002; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);">
        v2.1 GEOMETRIC · EVENT EDITION
    </div>

    <!-- JavaScript -->
    <script src="webjars/jquery/jquery.min.js"></script>
    <script src="components/shared/image-loader.js"></script>
    <script src="components/shared/folia-player.js"></script>
    <script src="components/event-list/event-list.js"></script>
    <script>
        // ===== 动效（渐进增强，与 artist-wiki / album 同一钩子）=====
        (function() {
            // 阅读进度条
            var bar = document.getElementById('wikiProgressBar');
            if (bar) {
                var update = function() {
                    var doc = document.documentElement;
                    var scrollable = doc.scrollHeight - window.innerHeight;
                    bar.style.width = scrollable > 0 ? (window.scrollY / scrollable * 100) + '%' : '0%';
                };
                window.addEventListener('scroll', update, { passive: true });
                window.addEventListener('resize', update);
                update();
            }

            // 滚动揭示
            var revealEls = document.querySelectorAll('[data-rv]');
            if ('IntersectionObserver' in window && revealEls.length > 0) {
                var observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
                revealEls.forEach(function(el) {
                    el.classList.add('rv-armed');
                    observer.observe(el);
                });
            }

            // 卡片入场 stagger + 键盘可达：观察网格新增节点
            var grid = document.getElementById('eventGrid');
            function armKeyboard(el) {
                if (!el.hasAttribute('tabindex')) {
                    el.setAttribute('tabindex', '0');
                    var labelEl = el.querySelector('.event-card__name');
                    if (labelEl) el.setAttribute('aria-label', '查看 ' + labelEl.textContent.trim() + ' 的专辑');
                }
            }
            function armCards() {
                if (!grid) return;
                grid.querySelectorAll('.event-card:not([data-armed])').forEach(function(card, i) {
                    card.dataset.armed = '1';
                    card.style.setProperty('--i', i % 15);
                    armKeyboard(card);
                });
            }
            if (grid && 'MutationObserver' in window) {
                new MutationObserver(armCards).observe(grid, { childList: true });
            }
            armCards();

            // 筛选/排序按钮键盘可达（本页为原生 button，已可聚焦，无需处理）
            // 委托 Enter/Space 触发卡片
            document.addEventListener('keydown', function(e) {
                if (e.key !== 'Enter' && e.key !== ' ') return;
                var t = e.target;
                if (t instanceof Element && t.classList.contains('event-card')) {
                    e.preventDefault();
                    t.click();
                }
            });
        })();
    </script>
</body>
</html>
