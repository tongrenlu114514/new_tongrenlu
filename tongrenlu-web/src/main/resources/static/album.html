<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐库 - 东方同人录</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link href="webjars/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="assets/css/geometric-theme.css?v=20261240" rel="stylesheet">
    <link href="assets/css/wiki.css?v=20261240" rel="stylesheet">
    <link href="assets/css/list-page.css?v=20261240" rel="stylesheet">
    <link href="components/shared/pagination.css?v=20261240" rel="stylesheet">

    <style>
        /* ================================================================
           音乐库 — Award Tier Design System（与 wiki 同一语言）
           令牌 → 基础 → 头部 → 筛选工具条 → 网格卡片 → 骨架 → 分页 → 模态框 → 动效 → 响应式
           ================================================================ */

        .geo-music-page {
            padding-top: 80px;
            min-height: 100vh;
            background:
                linear-gradient(180deg, var(--wiki-paper-2) 0%, var(--wiki-paper) 40%);
        }

        /* 选区 / 滚动条 / 焦点 */
        .geo-music-page ::selection {
            background: var(--wiki-accent);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--wiki-paper-2);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--wiki-ink);
            border: 2px solid var(--wiki-paper-2);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--wiki-accent);
        }

        .geo-music-page a:focus-visible,
        .geo-music-page button:focus-visible,
        .geo-music-page input:focus-visible,
        .geo-music-page select:focus-visible,
        .geo-music-page .music-card:focus-visible,
        .geo-music-page .tag:focus-visible {
            outline: 2px solid var(--wiki-accent);
            outline-offset: 3px;
        }

        /* ===== 阅读进度条 ===== */
        .wiki-progress {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            z-index: 1200;
            background: transparent;
            pointer-events: none;
        }

        .wiki-progress__bar {
            display: block;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--wiki-blue), var(--wiki-accent));
            transition: width 0.1s linear;
        }

        /* ================= 动效原语 ================= */
        /* 共享动效原语由 wiki.css / list-page.css 提供，本页不再复制 */

        [data-rv].rv-armed {
            opacity: 0;
            transform: translateY(26px);
            transition:
                opacity 0.8s var(--wiki-ease) var(--rv-delay, 0s),
                transform 0.8s var(--wiki-ease) var(--rv-delay, 0s);
        }
        [data-rv].rv-armed.is-visible {
            opacity: 1;
            transform: none;
        }

        /* ===== 搜索 ===== */
        .geo-sort {
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .geo-sort__label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--wiki-muted);
        }

        .music-card .album-cover {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, var(--wiki-paper-2), #eceef5);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            overflow: hidden;
        }

        .music-card .album-cover::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(26, 26, 46, 0.35), transparent 45%);
            opacity: 0;
            transition: opacity 0.5s var(--wiki-ease);
            pointer-events: none;
        }

        .music-card:hover .album-cover::after {
            opacity: 1;
        }

        .music-card .album-cover img {
            transition: transform 0.7s var(--wiki-ease), filter 0.7s var(--wiki-ease);
        }

        .music-card:hover .album-cover img {
            transform: scale(1.07);
            filter: saturate(1.08);
        }

        .music-card .fallback-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            color: var(--wiki-muted);
            opacity: 0.3;
        }

        .music-card .card-content {
            padding: 1rem 1.1rem 1.1rem;
            border-top: 1.5px solid var(--wiki-line);
            position: relative;
            background: var(--wiki-paper);
        }

        .music-card .card-title {
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--wiki-ink);
            margin: 0 0 0.3rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }

        .music-card:hover .card-title {
            color: var(--wiki-accent-ink);
        }

        /* 宽屏：卡片只剩封面，专辑名做成底部浮层（原专辑描述的位置），悬浮或键盘聚焦时滑入 */
        @media (hover: hover) and (min-width: 601px) {
            .music-card:not(.skeleton-card) .card-content {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 4;
                border-top: none;
                background: linear-gradient(transparent, rgba(26, 26, 46, 0.92));
                padding: 2.4rem 1rem 0.9rem;
                transform: translateY(100%);
                transition: transform 0.45s var(--wiki-ease);
                pointer-events: none;
            }
            .music-card:not(.skeleton-card):hover .card-content,
            .music-card:not(.skeleton-card):focus .card-content,
            .music-card:not(.skeleton-card):focus-within .card-content { transform: none; }

            .music-card .card-title,
            .music-card:hover .card-content .card-title { color: #fff; }
        }

        .music-card .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 52px;
            height: 52px;
            background: var(--wiki-accent-ink);
            border: none;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.6);
            transition:
                opacity 0.35s ease,
                transform 0.4s var(--wiki-ease-snap),
                background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
            box-shadow: 3px 3px 0 rgba(26, 26, 46, 0.85);
        }

        .music-card:hover .play-button {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .music-card .play-button:hover {
            background: var(--wiki-blue);
            transform: translate(-50%, -50%) scale(1.08);
        }

        /* ===== 骨架屏 ===== */
        .skeleton-card {
            pointer-events: none;
        }

        .skeleton-card .skeleton-cover {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(90deg, var(--wiki-paper-2) 25%, #eceef5 50%, var(--wiki-paper-2) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }

        .skeleton-card .card-content {
            padding: 1rem 1.1rem;
            background: var(--wiki-paper);
        }

        .skeleton-card .skeleton-title {
            height: 14px;
            background: var(--wiki-paper-2);
            margin-bottom: 0.5rem;
        }

        .skeleton-card .skeleton-stats {
            height: 10px;
            width: 50%;
            background: var(--wiki-paper-2);
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .no-results, .error {
            grid-column: 1/-1;
            text-align: center;
            padding: var(--ws-xl);
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            letter-spacing: 0.1em;
            color: var(--wiki-muted);
        }

        /* ===== 分页（结构、样式与无障碍行为见 components/shared/pagination.css） ===== */
        .geo-music-page .geo-pagination {
            padding: 0 2rem var(--ws-xl);
        }

        /* ===== 模态框（专辑详情）— Award 重设计 ===== */
        .geo-modal {
            background: rgba(26, 26, 46, 0.78);
            -webkit-backdrop-filter: blur(8px) saturate(0.8);
            backdrop-filter: blur(8px) saturate(0.8);
        }

        .geo-modal.active {
            animation: modal-fade 0.35s var(--wiki-ease) both;
        }

        .geo-modal__content {
            background: var(--wiki-paper);
            max-width: 840px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            border: 1.5px solid var(--wiki-line);
            box-shadow: 8px 8px 0 var(--wiki-ink);
            position: relative;
        }

        .geo-modal.active .geo-modal__content {
            animation: modal-in 0.55s var(--wiki-ease-snap) both;
        }

        .geo-modal__close {
            top: 0.9rem;
            right: 0.9rem;
            width: 38px;
            height: 38px;
            background: var(--wiki-accent-ink);
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition:
                background 0.3s ease,
                transform 0.35s var(--wiki-ease-snap);
        }

        .geo-modal__close:hover {
            background: var(--wiki-blue);
            transform: rotate(90deg) scale(1.06);
        }

        /* 头部：墨色渐变带 */
        .geo-modal__header {
            position: relative;
            overflow: hidden;
            display: flex;
            gap: var(--ws-m);
            padding: clamp(1.5rem, 3vw, 2.2rem);
            background:
                radial-gradient(ellipse 70% 120% at 90% 0%, rgba(233, 69, 96, 0.25), transparent 60%),
                linear-gradient(160deg, var(--wiki-ink) 0%, var(--wiki-ink-soft) 60%, #2a2a4a 100%);
            color: white;
        }

        .geo-modal__header::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            -webkit-mask-image: radial-gradient(ellipse 90% 100% at 50% 40%, black 30%, transparent 100%);
            mask-image: radial-gradient(ellipse 90% 100% at 50% 40%, black 30%, transparent 100%);
            pointer-events: none;
        }

        .geo-modal__header::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--wiki-accent), var(--wiki-blue));
            transform-origin: left;
            animation: wiki-line-grow 0.9s var(--wiki-ease) 0.25s both;
        }

        .geo-modal__cover,
        .album-art {
            clip-path: none;
            width: clamp(120px, 18vw, 160px);
            aspect-ratio: 1;
            height: auto;
            background: var(--wiki-accent);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px solid #fff;
            box-shadow: 7px 7px 0 rgba(233, 69, 96, 0.6);
            flex-shrink: 0;
            position: relative;
            z-index: 2;
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .album-art .fallback-content {
            font-size: 3rem;
            color: white;
            opacity: 0.5;
        }

        .geo-modal__info {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 2;
        }

        .geo-modal__eyebrow {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.66rem;
            font-weight: 600;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .geo-modal__eyebrow::before {
            content: '';
            width: 1.6rem;
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
        }

        .album-title {
            font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif;
            font-size: clamp(1.9rem, 3.4vw, 2.6rem);
            letter-spacing: 0.04em;
            line-height: 1;
            color: #fff;
            margin-bottom: 0.55rem;
            word-break: break-word;
        }

        .album-artist {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            font-size: 1rem;
            color: rgba(255,255,255,0.78);
            margin-bottom: var(--ws-s);
        }

        .album-meta {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: var(--ws-s);
        }

        .meta-item {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.85);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 0.3rem 0.7rem;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
        }

        .meta-item i {
            font-size: 0.72rem;
            color: rgba(255,255,255,0.6);
        }

        .album-actions {
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }

        .album-actions .play-all-btn {
            transition: background 0.3s ease, transform 0.3s var(--wiki-ease), box-shadow 0.3s var(--wiki-ease);
        }

        .album-actions .play-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 0 rgba(233, 69, 96, 0.5);
        }

        .album-actions .play-all-btn:active {
            transform: translateY(0) scale(0.96);
        }

        .report-error-btn {
            width: 38px;
            height: 38px;
            background: transparent;
            border: 1.5px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.65);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.3s ease, color 0.3s ease, transform 0.3s var(--wiki-ease);
        }

        .report-error-btn:hover {
            border-color: var(--wiki-accent-ink);
            color: var(--wiki-accent-ink);
            transform: translateY(-2px);
        }

        /* 主体 */
        .geo-modal__body {
            padding: clamp(1.25rem, 2.5vw, 2rem);
        }

        .album-description {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            font-size: 0.9rem;
            font-weight: 300;
            color: #3a3d52;
            line-height: 1.9;
            background: var(--wiki-paper-2);
            border-left: 3px solid var(--wiki-accent);
            padding: 1rem 1.25rem;
            margin-bottom: var(--ws-m);
        }

        .track-list h3 {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 0.1em;
            color: var(--wiki-ink);
            margin-bottom: var(--ws-s);
            padding-bottom: 0.7rem;
            border-bottom: 1.5px solid var(--wiki-line);
            position: relative;
        }

        .track-list h3::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -1.5px;
            width: 3rem;
            height: 3px;
            background: var(--wiki-accent);
        }

        .track-list h3 i {
            color: var(--wiki-accent);
            font-size: 1rem;
        }

        .tracks {
            list-style: none;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 0.35rem;
        }

        .tracks::-webkit-scrollbar {
            width: 6px;
        }
        .tracks::-webkit-scrollbar-track {
            background: var(--wiki-paper-2);
        }
        .tracks::-webkit-scrollbar-thumb {
            background: var(--wiki-line);
            border: none;
        }
        .tracks::-webkit-scrollbar-thumb:hover {
            background: var(--wiki-accent);
        }

        .track {
            display: flex;
            align-items: center;
            padding: 0.7rem 0.75rem;
            border-bottom: 1px solid var(--wiki-line);
            cursor: pointer;
            transition: background 0.25s ease, box-shadow 0.25s ease;
        }

        .track:hover {
            background: var(--wiki-paper-2);
            box-shadow: inset 3px 0 0 var(--wiki-accent);
        }

        .track-play-btn {
            width: 30px;
            height: 30px;
            background: var(--wiki-accent-ink);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            margin-right: 0.6rem;
            flex-shrink: 0;
            transition: background 0.3s ease, transform 0.3s var(--wiki-ease-snap);
        }

        .track-play-btn:hover {
            background: var(--wiki-blue);
            transform: scale(1.12);
        }

        .track-number {
            font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif;
            width: 32px;
            font-size: 1rem;
            letter-spacing: 0.05em;
            color: var(--wiki-muted);
            flex-shrink: 0;
        }

        .track:hover .track-number {
            color: var(--wiki-accent-ink);
        }

        .track-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .track-title {
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--wiki-ink);
        }

        .track-subtitle {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            font-size: 0.74rem;
            color: var(--wiki-muted);
            margin-top: 2px;
        }

        /* 模态框动效原语 */
        @keyframes modal-fade {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes modal-in {
            from { opacity: 0; transform: translateY(26px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ================= 响应式 ================= */
        @media (max-width: 600px) {
            .geo-modal__header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .geo-modal__meta, .album-meta, .album-actions {
                justify-content: center;
            }
            .geo-modal__content {
                box-shadow: 8px 8px 0 var(--wiki-ink);
            }
            .geo-music-page {
                padding-top: 62px;
            }
            .geo-music-page .geo-pagination {
                padding: 0 1.25rem var(--ws-l);
            }

            /* 行式列表：小封面 + 标题，一屏能看十张左右 */
            .music-card {
                display: flex;
                align-items: center;
                min-height: 64px;
            }
            .music-card::before { display: none; }
            .music-card .album-cover {
                width: 64px;
                height: auto;
                align-self: stretch;
                aspect-ratio: auto;
                flex: 0 0 64px;
                border-right: 1.5px solid var(--wiki-line);
            }
            .music-card .album-cover::after,
            .music-card .play-button { display: none; }
            .music-card .card-content {
                flex: 1;
                min-width: 0;
                border-top: none;
                padding: 0.6rem 0.9rem;
                display: flex;
                align-items: center;
            }
            .music-card .card-title { margin: 0; }
        }

        /* ================= 无障碍：减少动效 ================= */
        @media (prefers-reduced-motion: reduce) {
            .geo-music-page *,
            .geo-music-page *::before,
            .geo-music-page *::after,
            .geo-modal *,
            .geo-modal *::before,
            .geo-modal *::after {
                animation: none !important;
                transition-duration: 0.12s !important;
            }
            .music-card:hover { transform: none; }
            [data-rv].rv-armed {
                opacity: 1;
                transform: none;
            }
            .wiki-progress {
                display: none;
            }
        }
    </style>
</head>
<body class="geo-theme">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <!-- 阅读进度条 -->
    <div class="wiki-progress" aria-hidden="true">
        <span class="wiki-progress__bar" id="wikiProgressBar"></span>
    </div>

    <!-- 导航栏 -->
    <nav class="geo-nav">
        <a href="index.html" class="geo-logo">TONGRENLU</a>
        <div class="geo-nav__links">
            <a href="index.html" class="geo-nav__link">首页</a>
            <a href="album.html" class="geo-nav__link active">音乐库</a>
            <a href="artist-showcase.html" class="geo-nav__link">艺术家</a>
            <a href="event.html" class="geo-nav__link">展会</a>
        </div>
        <div class="geo-nav__stats">
            <span class="geo-nav__number" id="navAlbumCount">--</span>
            <span class="geo-nav__label">专辑</span>
        </div>
    </nav>

    <!-- 音乐库页面 -->
    <main id="main" class="geo-music-page">
        <!-- 搜索头部 -->
        <div class="geo-music-header">
            <div class="geo-music-header__decor" aria-hidden="true">
                <span class="geo-music-header__watermark">MUSIC</span>
            </div>
            <div class="geo-music-header__inner">
                <div class="geo-music-header__eyebrow">Doujin Music Archive</div>
                <h1 class="geo-music-title">音乐<span class="accent">库</span></h1>
                <p class="geo-music-subtitle">东方同人专辑档案 · 支持全文搜索与标签筛选</p>
                <div class="geo-search">
                    <input type="text" class="geo-search__input" id="searchInput" placeholder="搜索音乐、艺术家、专辑..." autocomplete="off" aria-label="搜索音乐、艺术家、专辑" role="combobox" aria-expanded="false" aria-controls="suggestionsList" aria-autocomplete="list">
                    <i class="fas fa-search geo-search__icon" aria-hidden="true"></i>

    <script>
        // ===== 动效（渐进增强，与 wiki 同一钩子）=====
        (function() {
            // 阅读进度条
            var bar = document.getElementById('wikiProgressBar');
            if (bar) {
                var update = function() {
                    var doc = document.documentElement;
                    var scrollable = doc.scrollHeight - window.innerHeight;
                    bar.style.width = scrollable > 0 ? (window.scrollY / scrollable * 100) + '%' : '0%';
                };
                window.addEventListener('scroll', update, { passive: true });
                window.addEventListener('resize', update);
                update();
            }

            // 滚动揭示
            var revealEls = document.querySelectorAll('[data-rv]');
            if ('IntersectionObserver' in window && revealEls.length > 0) {
                var observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
                revealEls.forEach(function(el) {
                    el.classList.add('rv-armed');
                    observer.observe(el);
                });
            }

            // 卡片入场 stagger：观察网格新增节点，分配批内 --i
            var grid = document.getElementById('musicGrid');
            if (grid && 'MutationObserver' in window) {
                var mo = new MutationObserver(function() {
                    var cards = grid.querySelectorAll('.music-card:not([data-armed])');
                    cards.forEach(function(card, i) {
                        card.dataset.armed = '1';
                        if (!card.classList.contains('skeleton-card')) {
                            card.style.setProperty('--i', i % 15);
                            armKeyboard(card, card.querySelector('.card-title'));
                        }
                    });
                });
                mo.observe(grid, { childList: true });
                // 首次立即武装
                grid.querySelectorAll('.music-card:not([data-armed])').forEach(function(card, i) {
                    card.dataset.armed = '1';
                    if (!card.classList.contains('skeleton-card')) {
                        card.style.setProperty('--i', i % 15);
                        armKeyboard(card, card.querySelector('.card-title'));
                    }
                });
            }

            // 键盘可达：为动态生成的 div 交互元素补 tabindex + 委托 Enter/Space 触发
            function armKeyboard(el, labelEl) {
                if (el.hasAttribute('tabindex')) return;
                el.setAttribute('tabindex', '0');
                var label = labelEl ? labelEl.textContent.trim() : '';
                if (label && !el.hasAttribute('aria-label')) {
                    el.setAttribute('aria-label', label);
                }
            }
            function armContainer(containerId, selector) {
                var container = document.getElementById(containerId);
                if (!container) return;
                var arm = function() {
                    container.querySelectorAll(selector).forEach(function(el) { armKeyboard(el); });
                };
                arm();
                if ('MutationObserver' in window) {
                    var mo = new MutationObserver(arm);
                    mo.observe(container, { childList: true, subtree: true });
                }
            }
            armContainer('filterTags', '.tag');
            armContainer('suggestionsList', '.suggestion-item, .geo-suggestions__item, .history-item');
            document.addEventListener('keydown', function(e) {
                if (e.key !== 'Enter' && e.key !== ' ') return;
                var t = e.target;
                if (!(t instanceof Element)) return;
                if (t.classList.contains('music-card') || t.classList.contains('tag')
                        || t.classList.contains('suggestion-item') || t.classList.contains('geo-suggestions__item')
                        || t.classList.contains('history-item')) {
                    e.preventDefault();
                    t.click();
                }
            });
        })();
    </script>
