<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>艺术家 Wiki - 东方同人录</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="assets/css/geometric-theme.css" rel="stylesheet">

    <style>
        /* ================================================================
           艺术家 Wiki — Award Tier Design System
           令牌 → 基础 → 列表视图 → 卡片 → 详情视图 → 动效 → 响应式
           ================================================================ */
        :root {
            /* 色彩令牌（:root 全局作用域：模态框等页面外元素也需要）：基于站点 geo 色板延伸 */
            --wiki-ink: #1a1a2e;
            --wiki-ink-soft: #23233d;
            --wiki-accent: #e94560;
            --wiki-blue: #0f3460;
            --wiki-paper: #ffffff;
            --wiki-paper-2: #f6f7fb;
            --wiki-line: #e5e7ef;
            --wiki-muted: #8a90a6;
            /* 空白令牌：8pt 节奏 */
            --ws-xs: 0.5rem;
            --ws-s: 1rem;
            --ws-m: 1.5rem;
            --ws-l: 2.5rem;
            --ws-xl: 4rem;
            --ws-2xl: clamp(4rem, 9vw, 7.5rem);
            /* 动效令牌 */
            --wiki-ease: cubic-bezier(0.22, 1, 0.36, 1);
            --wiki-ease-snap: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .geo-wiki-page {
            padding-top: 80px;
            min-height: 100vh;
            background:
                linear-gradient(180deg, var(--wiki-paper-2) 0%, var(--wiki-paper) 40%);
        }

        /* 选区 / 滚动条 / 焦点 — 细节质感 */
        .geo-wiki-page ::selection {
            background: var(--wiki-accent);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--wiki-paper-2);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--wiki-ink);
            border: 2px solid var(--wiki-paper-2);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--wiki-accent);
        }

        .geo-wiki-page a:focus-visible,
        .geo-wiki-page button:focus-visible,
        .geo-wiki-page input:focus-visible,
        .geo-wiki-page .wiki-card:focus-visible,
        .geo-wiki-page .wiki-album-item:focus-visible {
            outline: 2px solid var(--wiki-accent);
            outline-offset: 3px;
        }

        /* ===== 阅读进度条 ===== */
        .wiki-progress {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            z-index: 1200;
            background: transparent;
            pointer-events: none;
        }

        .wiki-progress__bar {
            display: block;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--wiki-blue), var(--wiki-accent));
            transition: width 0.1s linear;
        }

        /* ================= 动效原语 ================= */
        @keyframes wiki-rise {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes wiki-card-in {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes wiki-line-grow {
            from { transform: scaleX(0); }
            to   { transform: scaleX(1); }
        }
        @keyframes wiki-glow-drift {
            0%   { transform: translate(-10%, -6%) rotate(-4deg); }
            50%  { transform: translate(6%, 4%) rotate(3deg); }
            100% { transform: translate(-10%, -6%) rotate(-4deg); }
        }

        /* 滚动揭示（JS 渐进增强：有 data-rv 的元素由 JS 添加初始态） */
        [data-rv].rv-armed {
            opacity: 0;
            transform: translateY(26px);
            transition:
                opacity 0.8s var(--wiki-ease) var(--rv-delay, 0s),
                transform 0.8s var(--wiki-ease) var(--rv-delay, 0s);
        }
        [data-rv].rv-armed.is-visible {
            opacity: 1;
            transform: none;
        }

        /* ===== 列表视图 ===== */
        .geo-wiki-header {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(ellipse 60% 90% at 85% 10%, rgba(233, 69, 96, 0.22), transparent 60%),
                radial-gradient(ellipse 50% 80% at 10% 90%, rgba(15, 52, 96, 0.5), transparent 65%),
                linear-gradient(160deg, var(--wiki-ink) 0%, var(--wiki-ink-soft) 55%, #2a2a4a 100%);
            padding: var(--ws-2xl) 2rem var(--ws-xl);
            text-align: center;
        }

        /* 网格纹理层 */
        .geo-wiki-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
            background-size: 56px 56px;
            -webkit-mask-image: radial-gradient(ellipse 90% 100% at 50% 40%, black 30%, transparent 100%);
            mask-image: radial-gradient(ellipse 90% 100% at 50% 40%, black 30%, transparent 100%);
        }

        /* 漂移光斑层 */
        .geo-wiki-header::after {
            content: '';
            position: absolute;
            inset: -20%;
            background:
                radial-gradient(circle 300px at 80% 30%, rgba(233, 69, 96, 0.14), transparent 70%);
            animation: wiki-glow-drift 14s ease-in-out infinite;
            pointer-events: none;
        }

        /* 巨型轮廓水印 */
        .geo-wiki-header__watermark {
            position: absolute;
            top: 46%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif;
            font-size: clamp(10rem, 34vw, 30rem);
            letter-spacing: 0.08em;
            line-height: 1;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.07);
            user-select: none;
            pointer-events: none;
            white-space: nowrap;
        }

        .geo-wiki-header__inner {
            position: relative;
            z-index: 2;
        }

        .geo-wiki-header__eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: var(--ws-m);
            animation: wiki-rise 0.9s var(--wiki-ease) 0.05s both;
        }

        .geo-wiki-header__eyebrow::before,
        .geo-wiki-header__eyebrow::after {
            content: '';
            width: 2.5rem;
            height: 1px;
            background: rgba(255, 255, 255, 0.25);
        }

        .geo-wiki-title {
            font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif;
            font-size: clamp(3.2rem, 9vw, 6.5rem);
            line-height: 0.95;
            letter-spacing: 0.04em;
            color: #fff;
            margin: 0 0 var(--ws-m);
            animation: wiki-rise 0.9s var(--wiki-ease) 0.15s both;
        }

        .geo-wiki-title .accent {
            color: var(--wiki-accent);
        }

        .geo-wiki-subtitle {
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 300;
            font-size: clamp(0.9rem, 1.4vw, 1.05rem);
            letter-spacing: 0.14em;
            color: rgba(255, 255, 255, 0.65);
            margin: 0 auto var(--ws-xl);
            max-width: 34em;
            animation: wiki-rise 0.9s var(--wiki-ease) 0.25s both;
        }

        /* 搜索框 */
        .geo-wiki-search {
            max-width: 560px;
            margin: 0 auto;
            position: relative;
            animation: wiki-rise 0.9s var(--wiki-ease) 0.35s both;
        }

        .geo-wiki-search__input {
            width: 100%;
            padding: 1.1rem 3.2rem 1.1rem 1.4rem;
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.02em;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.94);
            color: var(--wiki-ink);
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            transition: background 0.4s var(--wiki-ease), box-shadow 0.4s var(--wiki-ease);
        }

        .geo-wiki-search__input:focus {
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 2px var(--wiki-accent) inset;
        }

        .geo-wiki-search__input::placeholder {
            color: var(--wiki-muted);
        }

        .geo-wiki-search__icon {
            position: absolute;
            right: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--wiki-muted);
            transition: color 0.3s ease, transform 0.3s var(--wiki-ease-snap);
        }

        .geo-wiki-search:focus-within .geo-wiki-search__icon {
            color: var(--wiki-accent);
            transform: translateY(-50%) scale(1.15);
        }

        .geo-wiki-search__clear {
            position: absolute;
            right: 2.7rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--wiki-muted);
            cursor: pointer;
            display: none;
            transition: color 0.25s ease, transform 0.25s var(--wiki-ease-snap);
        }

        .geo-wiki-search__clear:hover {
            color: var(--wiki-accent);
            transform: translateY(-50%) rotate(90deg);
        }

        .geo-wiki-search__clear.visible {
            display: block;
        }

        /* 索引工具条 */
        .geo-wiki-index-bar {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: var(--ws-s);
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--ws-l) 2rem 0;
        }

        .geo-wiki-index-bar__label {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--wiki-ink);
        }

        .geo-wiki-index-bar__label::after {
            content: '';
            flex: 1;
            min-width: 3rem;
            height: 2px;
            background: var(--wiki-line);
            transform-origin: left;
            animation: wiki-line-grow 1.2s var(--wiki-ease) 0.4s both;
        }

        .geo-wiki-index-bar__count {
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            color: var(--wiki-muted);
            white-space: nowrap;
        }

        .geo-wiki-index-bar__count b {
            font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif;
            font-size: 1.3rem;
            color: var(--wiki-accent);
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        /* 艺术家网格 */
        .geo-wiki-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: clamp(1rem, 2.2vw, 1.75rem);
            padding: var(--ws-l) 2rem var(--ws-xl);
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ===== 艺术家卡片 ===== */
        .wiki-card {
            background: var(--wiki-paper);
            border: 1.5px solid var(--wiki-line);
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition:
                transform 0.45s var(--wiki-ease),
                border-color 0.45s var(--wiki-ease),
                box-shadow 0.45s var(--wiki-ease);
            animation: wiki-card-in 0.7s var(--wiki-ease) both;
            animation-delay: min(calc(var(--i, 0) * 45ms), 0.6s);
        }

        .wiki-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 26px;
            height: 26px;
            background: var(--wiki-accent);
            clip-path: polygon(0 0, 100% 0, 0 100%);
            opacity: 0;
            transform: scale(0.4);
            transition: opacity 0.35s ease, transform 0.45s var(--wiki-ease-snap);
            z-index: 5;
        }

        .wiki-card:hover {
            transform: translateY(-6px);
            border-color: var(--wiki-ink);
            box-shadow: 10px 10px 0 var(--wiki-accent);
        }

        .wiki-card:hover::before {
            opacity: 1;
            transform: scale(1);
        }

        .wiki-card__cover {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, var(--wiki-paper-2), #eceef5);
            position: relative;
            overflow: hidden;
        }

        .wiki-card__image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(0.92);
            transition: transform 0.7s var(--wiki-ease), filter 0.7s var(--wiki-ease);
        }

        .wiki-card:hover .wiki-card__image {
            transform: scale(1.07);
            filter: saturate(1.08);
        }

        /* hover 时的深色压暗幕，衬托角标 */
        .wiki-card__cover::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(26, 26, 46, 0.35), transparent 45%);
            opacity: 0;
            transition: opacity 0.5s var(--wiki-ease);
        }

        .wiki-card:hover .wiki-card__cover::after {
            opacity: 1;
        }

        .wiki-card__placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: var(--wiki-ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }

        .wiki-card__badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 6;
            background: var(--wiki-accent);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 0.3rem 0.65rem;
            letter-spacing: 0.08em;
            clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%);
            transition: transform 0.4s var(--wiki-ease-snap);
        }

        .wiki-card:hover .wiki-card__badge {
            transform: translateX(-4px);
        }

        .wiki-card__info {
            padding: 1rem 1.1rem 1.1rem;
            border-top: 1.5px solid var(--wiki-line);
            position: relative;
        }

        .wiki-card__name {
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--wiki-ink);
            word-break: break-word;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }

        .wiki-card:hover .wiki-card__name {
            color: var(--wiki-accent);
        }

        .wiki-card__count {
            font-family: 'Outfit', sans-serif;
            font-size: 0.73rem;
            letter-spacing: 0.06em;
            color: var(--wiki-muted);
            margin-top: 0.25rem;
        }

        /* ===== 加载 / 空状态 ===== */
        #wikiLoading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--ws-xl);
            gap: var(--ws-s);
        }

        #wikiLoading .fa-spinner.fa-spin {
            font-size: 2rem;
            color: var(--wiki-accent);
        }

        #wikiLoading span,
        #wikiEmpty p {
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            color: var(--wiki-muted);
        }

        #wikiEmpty {
            text-align: center;
            padding: var(--ws-2xl) var(--ws-m);
            color: var(--wiki-muted);
        }

        #wikiEmpty .geo-wiki-empty__icon {
            font-size: 3rem;
            margin-bottom: var(--ws-s);
            opacity: 0.4;
        }

        /* ===== 详情视图 ===== */
        .geo-wiki-detail {
            max-width: 1140px;
            margin: 0 auto;
            padding: var(--ws-l) 2rem var(--ws-xl);
        }

        .geo-wiki-detail.is-entering > * {
            animation: wiki-rise 0.7s var(--wiki-ease) both;
        }
        .geo-wiki-detail.is-entering > *:nth-child(1) { animation-delay: 0.05s; }
        .geo-wiki-detail.is-entering > *:nth-child(2) { animation-delay: 0.12s; }
        .geo-wiki-detail.is-entering > *:nth-child(3) { animation-delay: 0.19s; }
        .geo-wiki-detail.is-entering > *:nth-child(4) { animation-delay: 0.26s; }
        .geo-wiki-detail.is-entering > *:nth-child(5) { animation-delay: 0.33s; }

        .geo-wiki-back {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: var(--wiki-ink);
            background: var(--wiki-paper);
            border: 1.5px solid var(--wiki-line);
            padding: 0.55rem 1.1rem;
            cursor: pointer;
            margin-bottom: var(--ws-l);
            transition:
                border-color 0.35s var(--wiki-ease),
                color 0.35s var(--wiki-ease),
                box-shadow 0.35s var(--wiki-ease),
                transform 0.35s var(--wiki-ease);
        }

        .geo-wiki-back i {
            transition: transform 0.35s var(--wiki-ease);
        }

        .geo-wiki-back:hover {
            border-color: var(--wiki-accent);
            color: var(--wiki-accent);
            box-shadow: 5px 5px 0 var(--wiki-accent);
            transform: translateX(-2px);
        }

        .geo-wiki-back:hover i {
            transform: translateX(-3px);
        }

        /* 条目头部 */
        .geo-wiki-hero {
            display: flex;
            gap: var(--ws-l);
            align-items: flex-start;
            position: relative;
            background: var(--wiki-paper);
            border: 1.5px solid var(--wiki-line);
            padding: clamp(1.5rem, 3vw, 2.5rem);
            box-shadow: 12px 12px 0 var(--wiki-ink);
        }

        .geo-wiki-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--wiki-accent) 0%, var(--wiki-blue) 100%);
            transform-origin: left;
            animation: wiki-line-grow 1s var(--wiki-ease) 0.2s both;
        }

        .geo-wiki-hero__avatar {
            width: clamp(150px, 20vw, 220px);
            aspect-ratio: 1;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--wiki-paper-2), #eceef5);
            overflow: hidden;
            position: relative;
            border: 3px solid var(--wiki-ink);
            box-shadow: 8px 8px 0 rgba(233, 69, 96, 0.85);
        }

        .geo-wiki-hero__avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .geo-wiki-hero__avatar .wiki-card__placeholder {
            width: 70px;
            height: 70px;
            font-size: 2rem;
        }

        .geo-wiki-hero__main {
            flex: 1;
            min-width: 0;
            padding-top: 0.25rem;
        }

        .geo-wiki-name {
            font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif;
            font-size: clamp(2.2rem, 5vw, 3.6rem);
            line-height: 1;
            color: var(--wiki-ink);
            letter-spacing: 0.03em;
            word-break: break-word;
            margin-bottom: var(--ws-s);
        }

        .geo-wiki-stats {
            display: flex;
            flex-wrap: wrap;
            gap: var(--ws-xs) 0.75rem;
            margin-bottom: var(--ws-m);
        }

        .geo-wiki-stat {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Outfit', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            color: white;
            background: var(--wiki-blue);
            padding: 0.42rem 0.95rem;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        .geo-wiki-stat--accent {
            background: var(--wiki-accent);
        }

        .geo-wiki-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
        }

        .geo-wiki-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.83rem;
            font-weight: 500;
            color: var(--wiki-ink);
            text-decoration: none;
            border: 1.5px solid var(--wiki-line);
            background: var(--wiki-paper-2);
            padding: 0.48rem 1rem;
            transition:
                border-color 0.3s var(--wiki-ease),
                color 0.3s var(--wiki-ease),
                transform 0.3s var(--wiki-ease),
                box-shadow 0.3s var(--wiki-ease);
        }

        .geo-wiki-link i {
            font-size: 0.78rem;
            transition: transform 0.3s var(--wiki-ease-snap);
        }

        .geo-wiki-link:hover {
            border-color: var(--wiki-accent);
            color: var(--wiki-accent);
            transform: translateY(-2px);
            box-shadow: 3px 3px 0 var(--wiki-accent);
        }

        .geo-wiki-link:hover i {
            transform: translate(2px, -2px);
        }

        /* 分节 */
        .geo-wiki-section {
            position: relative;
            background: var(--wiki-paper);
            border: 1.5px solid var(--wiki-line);
            padding: clamp(1.5rem, 3vw, 2.4rem);
            margin-top: var(--ws-l);
            transition: box-shadow 0.5s var(--wiki-ease);
        }

        .geo-wiki-section:hover {
            box-shadow: 6px 6px 0 rgba(26, 26, 46, 0.08);
        }

        .geo-wiki-section__title {
            display: flex;
            align-items: baseline;
            gap: 0.9rem;
            font-family: 'Bebas Neue', 'Noto Sans SC', sans-serif;
            font-size: clamp(1.5rem, 2.6vw, 1.9rem);
            letter-spacing: 0.12em;
            color: var(--wiki-ink);
            margin-bottom: var(--ws-m);
            padding-bottom: 0.9rem;
            border-bottom: 1.5px solid var(--wiki-line);
            position: relative;
        }

        .geo-wiki-section__title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -1.5px;
            width: 3.5rem;
            height: 3px;
            background: var(--wiki-accent);
        }

        .geo-wiki-section__index {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: var(--wiki-accent);
            transform: translateY(-2px);
        }

        /* 简介 markdown 排版 */
        .geo-wiki-desc {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 0.96rem;
            font-weight: 300;
            line-height: 2;
            letter-spacing: 0.01em;
            color: #3a3d52;
            word-break: break-word;
        }

        .geo-wiki-desc h3,
        .geo-wiki-desc h4 {
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-weight: 600;
            color: var(--wiki-ink);
            margin: 1.6rem 0 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .geo-wiki-desc h3::before,
        .geo-wiki-desc h4::before {
            content: '';
            width: 0.55rem;
            height: 0.55rem;
            background: var(--wiki-accent);
            clip-path: polygon(0 0, 100% 0, 0 100%);
            flex-shrink: 0;
        }

        .geo-wiki-desc h3 { font-size: 1.18rem; letter-spacing: 0.03em; }
        .geo-wiki-desc h4 { font-size: 1.05rem; letter-spacing: 0.02em; }

        .geo-wiki-desc p { margin: 0.55rem 0; }

        .geo-wiki-desc strong {
            font-weight: 600;
            color: var(--wiki-ink);
            background: linear-gradient(transparent 65%, rgba(233, 69, 96, 0.18) 65%);
        }

        .geo-wiki-desc code {
            font-family: 'Space Grotesk', monospace;
            font-size: 0.88em;
            background: var(--wiki-paper-2);
            border: 1px solid var(--wiki-line);
            padding: 0.1em 0.4em;
        }

        .geo-wiki-desc ul {
            padding-left: 0.4rem;
            margin: 0.6rem 0;
            list-style: none;
        }

        .geo-wiki-desc li {
            position: relative;
            padding-left: 1.4rem;
            margin: 0.4rem 0;
        }

        .geo-wiki-desc li::before {
            content: '—';
            position: absolute;
            left: 0;
            color: var(--wiki-accent);
            font-weight: 600;
        }

        .geo-wiki-desc--empty {
            color: var(--wiki-muted);
            font-style: italic;
        }

        /* 互联标签 chips */
        .geo-wiki-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
        }

        .geo-wiki-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            padding: 0.42rem 0.9rem;
            border: 1.5px solid var(--wiki-line);
            background: var(--wiki-paper-2);
            color: var(--wiki-ink);
            text-decoration: none;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            transition:
                background 0.3s var(--wiki-ease),
                color 0.3s var(--wiki-ease),
                border-color 0.3s var(--wiki-ease),
                transform 0.3s var(--wiki-ease),
                box-shadow 0.3s var(--wiki-ease);
        }

        .geo-wiki-tag i {
            font-size: 0.72rem;
        }

        .geo-wiki-tag--artist {
            border-color: rgba(15, 52, 96, 0.4);
            color: var(--wiki-blue);
        }

        .geo-wiki-tag--artist:hover {
            background: var(--wiki-blue);
            border-color: var(--wiki-blue);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 3px 3px 0 var(--wiki-accent);
        }

        .geo-wiki-tag--style {
            color: var(--wiki-muted);
            cursor: default;
            border-style: dashed;
        }

        /* 专辑区 */
        .geo-wiki-albums {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: clamp(0.8rem, 1.6vw, 1.1rem);
        }

        .wiki-album-item {
            background: var(--wiki-paper-2);
            border: 1.5px solid var(--wiki-line);
            overflow: hidden;
            cursor: pointer;
            transition:
                border-color 0.35s var(--wiki-ease),
                transform 0.35s var(--wiki-ease),
                box-shadow 0.35s var(--wiki-ease);
            animation: wiki-card-in 0.55s var(--wiki-ease) both;
            animation-delay: min(calc(var(--i, 0) * 35ms), 0.45s);
        }

        .wiki-album-item:hover {
            border-color: var(--wiki-accent);
            transform: translateY(-4px);
            box-shadow: 5px 5px 0 var(--wiki-accent);
        }

        .wiki-album-item__cover {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, var(--wiki-paper), #eceef5);
            overflow: hidden;
        }

        .wiki-album-item__cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s var(--wiki-ease);
        }

        .wiki-album-item:hover .wiki-album-item__cover img {
            transform: scale(1.09);
        }

        .wiki-album-item__title {
            padding: 0.7rem 0.75rem;
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-size: 0.8rem;
            color: var(--wiki-ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-top: 1.5px solid var(--wiki-line);
        }

        /* 专辑分页 */
        .geo-wiki-albums-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.45rem;
            margin-top: var(--ws-l);
        }

        .wiki-albums-pagination__info {
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            color: var(--wiki-muted);
            margin-right: 1rem;
        }

        .wiki-albums-pagination__btn {
            font-family: 'Space Grotesk', sans-serif;
            min-width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--wiki-line);
            background: var(--wiki-paper);
            color: var(--wiki-ink);
            cursor: pointer;
            padding: 0 0.5rem;
            transition:
                border-color 0.3s var(--wiki-ease),
                color 0.3s var(--wiki-ease),
                background 0.3s var(--wiki-ease),
                transform 0.15s ease;
        }

        .wiki-albums-pagination__btn:hover:not(:disabled) {
            border-color: var(--wiki-accent);
            color: var(--wiki-accent);
            transform: translateY(-2px);
        }

        .wiki-albums-pagination__btn:active:not(:disabled) {
            transform: translateY(0) scale(0.95);
        }

        .wiki-albums-pagination__btn.active {
            background: var(--wiki-accent);
            border-color: var(--wiki-accent);
            color: white;
            transform: none;
        }

        .wiki-albums-pagination__btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .wiki-albums-pagination__ellipsis {
            padding: 0 0.5rem;
            color: var(--wiki-muted);
        }

        /* 详情加载/错误 */
        .geo-wiki-detail-loading,
        .geo-wiki-detail-error {
            text-align: center;
            padding: var(--ws-2xl) var(--ws-m);
            color: var(--wiki-muted);
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            letter-spacing: 0.1em;
        }

        .geo-wiki-detail-loading i {
            font-size: 2rem;
            color: var(--wiki-accent);
            margin-bottom: var(--ws-s);
            display: block;
        }

        /* ================= 响应式 ================= */
        @media (max-width: 900px) {
            .geo-wiki-header {
                padding: var(--ws-xl) 1.5rem var(--ws-l);
            }
            .geo-wiki-hero {
                flex-direction: column;
                align-items: center;
                text-align: center;
                box-shadow: 8px 8px 0 var(--wiki-ink);
            }
            .geo-wiki-hero::before {
                animation-delay: 0s;
            }
            .geo-wiki-stats, .geo-wiki-links {
                justify-content: center;
            }
            .geo-wiki-section__title {
                flex-direction: column;
                gap: 0.2rem;
            }
        }

        @media (max-width: 600px) {
            .geo-wiki-page {
                padding-top: 72px;
            }
            .geo-wiki-header {
                padding: var(--ws-l) 1.25rem 2.5rem;
            }
            .geo-wiki-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.9rem;
                padding: var(--ws-m) 1.25rem var(--ws-l);
            }
            .geo-wiki-index-bar {
                padding: var(--ws-m) 1.25rem 0;
            }
            .geo-wiki-detail {
                padding: var(--ws-m) 1.25rem var(--ws-l);
            }
            .geo-wiki-hero {
                padding: var(--ws-m);
                gap: var(--ws-m);
            }
            .geo-wiki-hero__avatar {
                width: min(55vw, 180px);
            }
            .geo-wiki-albums {
                grid-template-columns: repeat(2, 1fr);
            }
            .geo-wiki-index-bar__label::after {
                display: none;
            }
        }

        /* ================= 无障碍：减少动效 ================= */
        @media (prefers-reduced-motion: reduce) {
            .geo-wiki-page *,
            .geo-wiki-page *::before,
            .geo-wiki-page *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            [data-rv].rv-armed {
                opacity: 1;
                transform: none;
            }
            .wiki-progress {
                display: none;
            }
        }
    </style>
</head>
<body class="geo-theme">
    <!-- 阅读进度条 -->
    <div class="wiki-progress" aria-hidden="true">
        <span class="wiki-progress__bar" id="wikiProgressBar"></span>
    </div>

    <!-- 导航栏 -->
    <nav class="geo-nav">
        <a href="index.html" class="geo-logo">TONGRENLU</a>
        <div class="geo-nav__links">
            <a href="index.html" class="geo-nav__link">首页</a>
            <a href="album.html" class="geo-nav__link">音乐库</a>
            <a href="artist-wiki.html" class="geo-nav__link active">艺术家</a>
            <a href="event.html" class="geo-nav__link">展会</a>
        </div>
        <div class="geo-nav__stats">
            <span class="geo-nav__number" id="navArtistCount">--</span>
            <span class="geo-nav__label">艺术家</span>
        </div>
    </nav>

    <!-- 艺术家 Wiki 页面 -->
    <div class="geo-wiki-page">
        <!-- 列表视图 -->
        <div id="wikiListView">
            <div class="geo-wiki-header">
                <span class="geo-wiki-header__watermark" aria-hidden="true">WIKI</span>
                <div class="geo-wiki-header__inner">
                    <div class="geo-wiki-header__eyebrow">Touhou Encyclopedia</div>
                    <h1 class="geo-wiki-title">艺术家 <span class="accent">WIKI</span></h1>
                    <p class="geo-wiki-subtitle">浏览同人音乐创作者的百科条目、作品与资料</p>
                    <div class="geo-wiki-search">
                        <input type="text" class="geo-wiki-search__input" id="wikiSearchInput" placeholder="搜索艺术家...">
                        <i class="fas fa-search geo-wiki-search__icon"></i>
                        <button class="geo-wiki-search__clear" id="wikiSearchClear" aria-label="清除搜索">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="geo-wiki-index-bar" data-rv>
                <div class="geo-wiki-index-bar__label">Index · 全部条目</div>
                <div class="geo-wiki-index-bar__count"><b id="wikiIndexCount">--</b> ENTRIES</div>
            </div>

            <div class="geo-wiki-grid" id="wikiGrid"></div>

            <div id="wikiLoading" style="display: none;">
                <i class="fas fa-spinner fa-spin"></i>
                <span>加载艺术家...</span>
            </div>

            <div id="wikiEmpty" style="display: none;">
                <i class="fas fa-book-open geo-wiki-empty__icon"></i>
                <p>未找到匹配的艺术家</p>
            </div>
        </div>

        <!-- 详情视图 -->
        <div class="geo-wiki-detail" id="wikiDetailView" style="display: none;">
            <button class="geo-wiki-back" id="wikiBackBtn">
                <i class="fas fa-arrow-left"></i> 返回列表
            </button>

            <div id="wikiDetailLoading">
                <i class="fas fa-spinner fa-spin"></i>
                <span>加载条目...</span>
            </div>

            <div id="wikiDetailError" class="geo-wiki-detail-error" style="display: none;">
                <i class="fas fa-book-dead" style="font-size: 2rem; margin-bottom: 1rem; display: block; opacity: 0.5;"></i>
                未找到该艺术家的条目
            </div>

            <div id="wikiDetailContent" style="display: none;">
                <!-- 条目头部 -->
                <div class="geo-wiki-hero">
                    <div class="geo-wiki-hero__avatar" id="wikiHeroAvatar"></div>
                    <div class="geo-wiki-hero__main">
                        <h1 class="geo-wiki-name" id="wikiHeroName">--</h1>
                        <div class="geo-wiki-stats" id="wikiHeroStats"></div>
                        <div class="geo-wiki-links" id="wikiHeroLinks"></div>
                    </div>
                </div>

                <!-- 简介 -->
                <div class="geo-wiki-section" data-rv>
                    <h2 class="geo-wiki-section__title"><span class="geo-wiki-section__index">01</span>简介</h2>
                    <div class="geo-wiki-desc" id="wikiDesc"></div>
                </div>

                <!-- 互联标签 -->
                <div class="geo-wiki-section" id="wikiTagsSection" style="display: none;" data-rv>
                    <h2 class="geo-wiki-section__title"><span class="geo-wiki-section__index">02</span>互联标签</h2>
                    <div class="geo-wiki-tags" id="wikiTagChips"></div>
                </div>

                <!-- 专辑 -->
                <div class="geo-wiki-section" data-rv>
                    <h2 class="geo-wiki-section__title"><span class="geo-wiki-section__index">03</span>专辑作品</h2>
                    <div class="geo-wiki-albums" id="wikiAlbums"></div>
                    <div class="geo-wiki-albums-pagination" id="wikiAlbumsPagination" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="geo-footer">
        <div class="geo-footer__logo">TONGRENLU</div>
        <p class="geo-footer__text">&copy; 2025 东方同人录. 本站所有内容版权归原作者所有.</p>
        <p class="geo-footer__text">本网站仅为学习交流使用，不涉及任何商业用途</p>
    </footer>

    <!-- 版本号 -->
    <div id="version-info" style="position: fixed; bottom: 10px; right: 10px; background: var(--geo-primary); color: white; padding: 5px 10px; font-family: 'Space Grotesk', sans-serif; font-size: 11px; z-index: 1002; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);">
        v2.1 GEOMETRIC · WIKI EDITION
    </div>

    <!-- JavaScript -->
    <script src="webjars/jquery/jquery.min.js"></script>
    <script src="components/shared/image-loader.js"></script>
    <script src="components/shared/folia-player.js"></script>
    <script src="components/artist-wiki/artist-wiki.js"></script>
</body>
</html>
