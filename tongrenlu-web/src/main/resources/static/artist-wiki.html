<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>艺术家词条 - 东方同人录</title>
    <!--
      旧艺术家页面已由统一百科词条页（wiki.html?type=artist）取代。
      本页仅保留为兼容壳：老书签 / 外部链接会自动跳转到词条页。
      旧 ?name= 按词条名跳转（后端会回退按 m_artist.name 解析）；
      旧 ?id= 是 m_artist.id，词条页按 tagId 解析会串条目，故统一回落到艺术家词条列表。
    -->
    <script>
        (function() {
            var name = new URLSearchParams(window.location.search).get('name');
            var target = 'wiki.html?type=artist' + (name ? '&tag=' + encodeURIComponent(name) : '');
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>艺术家页面已迁移至 <a href="wiki.html?type=artist">艺术家词条</a>，正在跳转…</p>
    <noscript><p>请手动打开 <a href="wiki.html?type=artist">艺术家词条</a>。</p></noscript>
</body>
</html>
