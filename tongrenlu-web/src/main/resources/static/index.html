<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东方同人录 - 几何未来主义</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="assets/css/geometric-theme.css" rel="stylesheet">
    
    <style>
        /* Hero：全幅动态封面画廊背景 */
        .geo-hero {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        
        /* 画廊背景 */
        .geo-gallery-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 4px;
            padding: 4px;
            opacity: 1;
            z-index: 0;
        }
        
        .geo-gallery-bg__item {
            position: relative;
            overflow: hidden;
            background: var(--geo-bg-alt);
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .geo-gallery-bg__item:hover {
            transform: scale(1.05);
            z-index: 1;
        }
        
        .geo-gallery-bg__cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-size: cover;
            background-position: center;
            transition: transform 8s ease, opacity 0.8s ease;
        }
        
        .geo-gallery-bg__cover.zoom {
            transform: scale(1.15);
        }
        
        .geo-gallery-bg__cover.fade {
            opacity: 0;
        }
        
        @media (max-width: 1024px) {
            .geo-gallery-bg {
                grid-template-columns: repeat(4, 1fr);
                grid-template-rows: repeat(5, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .geo-gallery-bg {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(4, 1fr);
            }
        }
    </style>
    <!-- 首页动效样式：置于内联样式之后，可覆盖其中的过渡规则 -->
    <link href="assets/css/home-dynamic.css" rel="stylesheet">
</head>
<body class="geo-theme">
    <!-- 导航栏 -->
    <nav class="geo-nav">
        <div class="geo-nav__brand">
            <a href="index.html" class="geo-logo">TONGRENLU</a>
            <span class="geo-logo-zh">东方同人录</span>
        </div>
        <div class="geo-nav__links">
            <a href="index.html" class="geo-nav__link active">首页</a>
            <a href="album.html" class="geo-nav__link">音乐库<span class="geo-nav__count" id="navAlbumCount">--</span></a>
            <a href="artist-showcase.html" class="geo-nav__link">艺术家<span class="geo-nav__count" id="navArtistCount">--</span></a>
            <a href="event.html" class="geo-nav__link">展会<span class="geo-nav__count" id="navEventCount">--</span></a>
        </div>
    </nav>
    
    <!-- Hero区域 -->
    <section class="geo-hero">
        <!-- 画廊背景 -->
        <div class="geo-gallery-bg" id="galleryBg">
            <!-- JavaScript动态生成 -->
        </div>

        <!-- 漂浮几何装饰（JS注入，动效） -->
        <div class="geo-hero__floaties" aria-hidden="true"></div>
    </section>

    <!-- 滚动字幕（动效）：Hero 与页脚之间的流动信息带 -->
    <div class="geo-ticker" aria-hidden="true">
        <div class="geo-ticker__track"></div>
    </div>
    
    <!-- 页脚 -->
    <footer class="geo-footer">
        <div class="geo-footer__logo">TONGRENLU</div>
        <p class="geo-footer__text">&copy; 2025 东方同人录. 本站所有内容版权归原作者所有.</p>
        <p class="geo-footer__text">本网站仅为学习交流使用，不涉及任何商业用途</p>
    </footer>
    
    <!-- 版本号 -->
    <div id="version-info" style="position: fixed; bottom: 10px; right: 10px; background: var(--geo-primary); color: white; padding: 5px 10px; font-family: 'Space Grotesk', sans-serif; font-size: 11px; z-index: 1002; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);">
        v2.2 MOSAIC
    </div>

    <!-- JavaScript -->
    <script src="webjars/jquery/jquery.min.js"></script>
    <script src="components/shared/image-loader.js"></script>
    <script>
        // 获取优化后的图片URL
        function getOptimizedImageUrl(url, width, height) {
            if (!url) return url;
            if (url.includes('music.126.net') || url.includes('127.net')) {
                const baseUrl = url.split('?')[0];
                return `${baseUrl}?param=${width}y${height}`;
            }
            return url;
        }
        
        $(function() {
            // 画廊配置
            const gridCols = window.innerWidth <= 768 ? 12 : 
                            window.innerWidth <= 1024 ? 20 : 24;
            let albumData = []; // 保存专辑数据（包含id和封面URL）
            let currentIndex = 0;
            
            // 初始化画廊网格
            function initGalleryGrid() {
                const $gallery = $('#galleryBg');
                $gallery.empty();
                
                for (let i = 0; i < gridCols; i++) {
                    const $item = $('<div class="geo-gallery-bg__item" data-album-id=""></div>');
                    const $cover = $('<div class="geo-gallery-bg__cover"></div>');
                    $item.append($cover);
                    $gallery.append($item);
                }
                
                // 绑定点击事件
                $gallery.on('click', '.geo-gallery-bg__item', function() {
                    const albumId = $(this).data('album-id');
                    if (albumId) {
                        // 跳转到播放器页面
                        window.open(`player.html?album=${albumId}`, '_blank');
                    }
                });
            }
            
            // 加载随机专辑封面（首次加载）
            function loadRandomCovers() {
                $.ajax({
                    url: 'api/music/random-albums',
                    method: 'GET',
                    data: { count: 50 },
                    success: function(response) {
                        if (response && response.length > 0) {
                            // 保存专辑数据（id和封面URL）
                            albumData = response
                                .filter(album => album.cloudMusicPicUrl)
                                .map(album => ({
                                    id: album.id,
                                    coverUrl: album.cloudMusicPicUrl
                                }));
                            
                            // 打乱顺序
                            albumData.sort(() => Math.random() - 0.5);
                            
                            // 填充画廊
                            fillGallery();
                        }
                    },
                    error: function() {
                        console.error('Failed to load album covers');
                    }
                });
            }
            
            // 已使用的封面索引，避免重复
            let usedCoverIndices = new Set();
            let isLoadingNewCovers = false;
            
            // 获取未使用的专辑数据
            function getUnusedAlbum() {
                if (albumData.length === 0) return null;
                
                // 如果所有封面都用过了，调用API获取新数据
                if (usedCoverIndices.size >= albumData.length) {
                    if (!isLoadingNewCovers) {
                        loadNewCovers();
                    }
                    // 返回随机一个
                    return albumData[Math.floor(Math.random() * albumData.length)];
                }
                
                // 找一个未使用的索引
                let index;
                let attempts = 0;
                do {
                    index = Math.floor(Math.random() * albumData.length);
                    attempts++;
                } while (usedCoverIndices.has(index) && attempts < 100);
                
                usedCoverIndices.add(index);
                return albumData[index];
            }
            
            // 加载新封面数据
            function loadNewCovers() {
                if (isLoadingNewCovers) return;
                isLoadingNewCovers = true;
                
                $.ajax({
                    url: 'api/music/random-albums',
                    method: 'GET',
                    data: { count: 50 },
                    success: function(response) {
                        if (response && response.length > 0) {
                            // 更新专辑数据
                            albumData = response
                                .filter(album => album.cloudMusicPicUrl)
                                .map(album => ({
                                    id: album.id,
                                    coverUrl: album.cloudMusicPicUrl
                                }));
                            
                            // 打乱顺序
                            albumData.sort(() => Math.random() - 0.5);
                            
                            // 重置已使用索引
                            usedCoverIndices.clear();
                        }
                        isLoadingNewCovers = false;
                    },
                    error: function() {
                        isLoadingNewCovers = false;
                    }
                });
            }
            
            // 启动持续轮换（单线程，小波次翻动，更有“呼吸感”）
            function startContinuousRefresh() {
                function doRefresh() {
                    const $items = $('.geo-gallery-bg__item');
                    if ($items.length === 0) {
                        setTimeout(doRefresh, 600);
                        return;
                    }

                    // 获取未悬浮的格子
                    const $notHovered = $items.not(':hover');
                    if ($notHovered.length === 0) {
                        // 所有格子都被悬浮，等待后再试
                        setTimeout(doRefresh, 400);
                        return;
                    }

                    // 每波随机挑 2 个未悬浮格子，交错翻页，形成流动感
                    const waveSize = 2;
                    const pool = $notHovered.toArray();
                    const chosen = [];
                    for (let i = 0; i < waveSize && pool.length > 0; i++) {
                        const idx = Math.floor(Math.random() * pool.length);
                        chosen.push(pool.splice(idx, 1)[0]);
                    }

                    chosen.forEach(function (el, i) {
                        const $item = $(el);
                        const $cover = $item.find('.geo-gallery-bg__cover');

                        setTimeout(function () {
                            // 淡出
                            $cover.addClass('fade');

                            setTimeout(function () {
                                const album = getUnusedAlbum();
                                if (album) {
                                    const optimizedUrl = getOptimizedImageUrl(album.coverUrl, 300, 300);
                                    $cover.css('background-image', `url('${optimizedUrl}')`);
                                    // 更新专辑ID
                                    $item.data('album-id', album.id);

                                    // 偶发“呼吸放大”（ken burns），让画面更有纵深感
                                    if (Math.random() < 0.4) {
                                        $cover.addClass('zoom');
                                    }
                                }
                                // 淡入
                                $cover.removeClass('fade');
                            }, 480);
                        }, i * 150);
                    });

                    // 随机让一部分已放大封面慢慢缩回
                    $('.geo-gallery-bg__cover.zoom').each(function () {
                        if (Math.random() < 0.1) {
                            $(this).removeClass('zoom');
                        }
                    });

                    // 波次间隔
                    setTimeout(doRefresh, 1150);
                }

                // 首次延迟1秒开始
                setTimeout(doRefresh, 1000);
            }
            
            // 填充画廊
            function fillGallery() {
                const $items = $('.geo-gallery-bg__item');
                $items.each(function(index) {
                    const album = albumData[index % albumData.length];
                    if (album) {
                        const optimizedUrl = getOptimizedImageUrl(album.coverUrl, 300, 300);
                        $(this).find('.geo-gallery-bg__cover').css('background-image', `url('${optimizedUrl}')`);
                        $(this).data('album-id', album.id);
                    }
                });
            }
            
            // 初始化
            initGalleryGrid();
            
            // 首次加载
            loadRandomCovers();
            
            // 3秒后开始持续轮换
            setTimeout(startContinuousRefresh, 3000);
            
            // 加载统计数据
            $.ajax({
                url: 'api/music/album-stats',
                method: 'GET',
                success: function(response) {
                    if (response && response.success && response.data) {
                        const count = response.data.published || response.data.total || 0;
                        $('#navAlbumCount').text(count.toLocaleString());
                    }
                }
            });
            
            $.ajax({
                url: 'api/music/artists',
                method: 'GET',
                data: { limit: 1 },
                success: function(response) {
                    if (response && response.total !== undefined) {
                        $('#navArtistCount').text(response.total.toLocaleString());
                    } else if (response && response.count !== undefined) {
                        $('#navArtistCount').text(response.count.toLocaleString());
                    }
                }
            });
            
            $.ajax({
                url: 'api/events/count',
                method: 'GET',
                success: function(response) {
                    if (response && response.count !== undefined) {
                        $('#navEventCount').text(response.count.toLocaleString());
                    }
                }
            });
        });
    </script>

    <script>
        // ============ 首页动效脚本（独立于上方画廊逻辑） ============
        $(function () {
            'use strict';

            const reduceMotion = window.matchMedia &&
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // ---------- 画廊首次填充：层叠浮现 ----------
            let galleryRevealed = false;
            let galleryProbeCount = 0;

            function revealGallery() {
                if (galleryRevealed) return;
                galleryRevealed = true;
                $('#galleryBg .geo-gallery-bg__item').each(function (index) {
                    const el = this;
                    setTimeout(() => el.classList.add('is-in'), 60 * index);
                });
            }

            const galleryTimer = setInterval(function () {
                const $cover = $('#galleryBg .geo-gallery-bg__cover').first();
                if ($cover.length && ($cover[0].style.backgroundImage || $cover[0].style.background)) {
                    clearInterval(galleryTimer);
                    revealGallery();
                    return;
                }
                // 兜底：即使接口失败也显示底图
                galleryProbeCount++;
                if (galleryProbeCount > 40) {
                    clearInterval(galleryTimer);
                    revealGallery();
                }
            }, 150);

            // ---------- 统计数字：滚动增长 + 脉冲 ----------
            function animateNumber(el, target) {
                el.dataset.counted = '1';
                if (reduceMotion) {
                    el.textContent = target.toLocaleString();
                    return;
                }
                const duration = 1100;
                let start = null;

                function step(ts) {
                    if (!start) start = ts;
                    const p = Math.min(1, (ts - start) / duration);
                    const eased = 1 - Math.pow(1 - p, 3);
                    el.textContent = Math.round(target * eased).toLocaleString();
                    if (p < 1) {
                        requestAnimationFrame(step);
                    } else {
                        el.textContent = target.toLocaleString();
                        el.classList.add('is-bumped');
                        setTimeout(() => el.classList.remove('is-bumped'), 700);
                    }
                }
                requestAnimationFrame(step);
            }

            ['navAlbumCount', 'navArtistCount', 'navEventCount'].forEach(function (id) {
                const el = document.getElementById(id);
                if (!el) return;
                new MutationObserver(function () {
                    if (el.dataset.counted) return;
                    const raw = (el.textContent || '').replace(/[,，\s]/g, '');
                    if (!/^\d+$/.test(raw)) return;
                    animateNumber(el, parseInt(raw, 10));
                }).observe(el, { childList: true, characterData: true, subtree: true });
            });

            // ---------- 底部滚动字幕（两组相同内容实现无缝循环） ----------
            const tickerWords = [
                '東方Project', '同人音楽', '例大祭', 'COMIC MARKET',
                '紅楼夢', '音楽アーカイブ', 'MUSIC FOR THE GENKYOU'
            ];

            function buildTickerGroup() {
                const group = document.createElement('div');
                group.className = 'geo-ticker__group';
                tickerWords.forEach(function (word) {
                    const span = document.createElement('span');
                    span.className = 'geo-ticker__item';
                    span.textContent = word;
                    group.appendChild(span);
                });
                return group;
            }

            const tickerTrack = document.querySelector('.geo-ticker__track');
            if (tickerTrack) {
                tickerTrack.appendChild(buildTickerGroup());
                tickerTrack.appendChild(buildTickerGroup());
            }

            // ---------- 漂浮几何装饰注入 ----------
            function injectFloaties() {
                if (reduceMotion) return;
                const wrap = document.querySelector('.geo-hero__floaties');
                if (!wrap) return;
                const kinds = ['diamond', 'ring', 'plus', 'square'];
                for (let i = 0; i < 10; i++) {
                    const span = document.createElement('span');
                    span.className = 'geo-floaty geo-floaty--' + kinds[i % kinds.length];
                    span.style.left = (3 + Math.random() * 94).toFixed(1) + '%';
                    const duration = 14 + Math.random() * 14;
                    span.style.animationDuration = duration.toFixed(2) + 's';
                    span.style.animationDelay = (-Math.random() * duration).toFixed(2) + 's';
                    wrap.appendChild(span);
                }
            }
            injectFloaties();

            // ---------- 鼠标视差（仅桌面精确指针 + 非减少动效时启用） ----------
            function initParallax() {
                if (reduceMotion) return;
                if (!window.matchMedia || !window.matchMedia('(pointer: fine)').matches) return;
                const hero = document.querySelector('.geo-hero');
                const bg = document.getElementById('galleryBg');
                const content = document.querySelector('.geo-hero__content');
                if (!hero || !bg) return;
                let ticking = false;

                function applyParallax(e) {
                    ticking = false;
                    const rect = hero.getBoundingClientRect();
                    const nx = (e.clientX - rect.left) / rect.width - 0.5;
                    const ny = (e.clientY - rect.top) / rect.height - 0.5;
                    bg.style.transform = 'translate(' + (nx * -16) + 'px, ' + (ny * -10) + 'px) scale(1.04)';
                    if (content) {
                        content.style.transform = 'translate(' + (nx * 9) + 'px, ' + (ny * 7) + 'px)';
                    }
                }

                hero.addEventListener('mousemove', function (e) {
                    if (!ticking) {
                        ticking = true;
                        requestAnimationFrame(function () { applyParallax(e); });
                    }
                });
                hero.addEventListener('mouseleave', function () {
                    bg.style.transform = '';
                    if (content) content.style.transform = '';
                });
            }
            initParallax();
        });
    </script>
</body>
</html>
